<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MFOOTBALL V6</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06130c;font-family:Arial,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}.rotate{display:none;position:fixed;inset:0;z-index:50;background:#061018;color:#fff;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:22px}.rotate b{display:block;font-size:58px;margin-bottom:12px}.menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:radial-gradient(circle at 50% 10%,#29435d,#071018 72%);overflow:auto}.panel{width:min(1050px,95vw);max-height:94vh;overflow:auto;background:#08131eeF;border:1px solid #ffffff25;border-radius:22px;padding:18px;box-shadow:0 25px 90px #000b}.title{text-align:center;font-size:31px;margin:0;font-weight:1000;letter-spacing:2px}.sub{text-align:center;color:#aab8c7;margin:4px 0 14px}.teams{display:flex;align-items:center;justify-content:center;gap:16px}.team{width:220px;text-align:center;border:2px solid #ffffff20;border-radius:18px;padding:12px;background:#ffffff08;cursor:pointer}.team.active{border-color:#ffd21c;box-shadow:0 0 30px #ffd21c22}.team img{width:72px;height:72px;object-fit:contain}.team b{display:block;margin-top:5px}.vs{font-size:28px;font-weight:1000}.tabs{display:flex;gap:8px;margin:14px 0}.tab{flex:1;padding:10px;border:0;border-radius:10px;background:#ffffff10;color:#fff;font-weight:900}.tab.active{background:#1769e8}.section{display:none}.section.active{display:block}.roster{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.card{display:flex;align-items:center;gap:7px;padding:6px;border:1px solid #ffffff12;border-radius:11px;background:#ffffff08;min-width:0}.card img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#26313c}.num{font-size:10px;color:#91a0b1}.name{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.start{width:100%;margin-top:14px;border:0;border-radius:14px;padding:15px;background:#ffd21c;color:#111;font-size:20px;font-weight:1000}.hint{text-align:center;color:#aab8c7;font-size:12px;margin-top:7px}.hud{position:fixed;inset:0;z-index:10;pointer-events:none}.scorebar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#071018dd;border:1px solid #ffffff22;border-radius:14px;padding:7px 14px;color:#fff;font-weight:1000}.crest{width:34px;height:34px;object-fit:contain}.clock{font-size:15px;color:#ddd}.pause{pointer-events:auto;position:absolute;top:10px;right:12px;width:44px;height:40px;border:0;border-radius:10px;background:#071018dd;color:#fff;font-size:18px}.controls{position:fixed;inset:0;z-index:12;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:22px;bottom:20px;width:125px;height:125px;border-radius:50%;border:2px solid #ffffff38;background:#ffffff10;box-shadow:inset 0 0 0 20px #ffffff06}.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#ffffff55;border:1px solid #ffffff77}.buttons{pointer-events:none;position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,70px);gap:8px}.btn{pointer-events:auto;height:58px;border:0;border-radius:16px;background:#eef2f6;color:#111;font-weight:1000;box-shadow:0 5px 14px #0008}.btn:active{transform:scale(.93)}.shoot{background:#ffd21c}.run{background:#43d17a}.hidden{display:none!important}.msg{position:absolute;top:74px;left:50%;transform:translateX(-50%);font-size:22px;font-weight:1000;text-shadow:0 2px 8px #000;opacity:0;transition:.2s}.msg.show{opacity:1}@media(max-width:850px){.roster{grid-template-columns:repeat(4,1fr)}.team{width:170px}.buttons{grid-template-columns:repeat(3,62px)}.btn{height:52px}.joy{width:108px;height:108px}}@media(max-width:600px){.roster{grid-template-columns:repeat(3,1fr)}.panel{padding:12px}.title{font-size:24px}.team{width:135px}.team img{width:55px;height:55px}}@media(max-width:600px) and (orientation:portrait){.rotate{display:flex}.menu{display:none}.hud,.controls{display:none}}</style></head><body><canvas id="game"></canvas><div id="rotate" class="rotate"><div><b>↻</b>أدر الهاتف إلى الوضع الأفقي<br><small>ثم اضغط ابدأ المباراة</small></div></div><div id="menu" class="menu"><div class="panel"><h1 class="title">MFOOTBALL</h1><div class="sub">EL CLÁSICO • MATCHDAY</div><div class="teams"><div id="barcaBtn" class="team active"><img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg"><b>FC BARCELONA</b></div><div class="vs">VS</div><div id="madridBtn" class="team"><img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg"><b>REAL MADRID</b></div></div><div class="tabs"><button class="tab active" data-tab="players">قائمة اللاعبين</button><button class="tab" data-tab="match">المباراة</button></div><div id="players" class="section active"><div id="roster" class="roster"></div></div><div id="match" class="section"><div class="hint">سانتياغو برنابيو • 5 دقائق • مباراة أفقية • كرة ومرمى وحركة فعلية</div></div><button id="startBtn" class="start">ابدأ المباراة</button><div class="hint">عصا الحركة • تمريرة • بينية • تسديد • جري • تبديل • افتكاك</div></div></div><div id="hud" class="hud hidden"><div class="scorebar"><img id="homeCrest" class="crest"><span id="homeScore">برشلونة 0</span><span>—</span><span id="awayScore">0 ريال مدريد</span><img id="awayCrest" class="crest"><span id="clock" class="clock">05:00</span></div><button id="pauseBtn" class="pause">Ⅱ</button><div id="message" class="msg"></div></div><div id="controls" class="controls hidden"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="buttons"><button id="switchBtn" class="btn">تبديل</button><button id="passBtn" class="btn">تمريرة</button><button id="throughBtn" class="btn">بينية</button><button id="runBtn" class="btn run">جري</button><button id="shootBtn" class="btn shoot">تسديد</button><button id="tackleBtn" class="btn">افتكاك</button></div></div><script>(function(){'use strict';const $=id=>document.getElementById(id);const canvas=$('game'),ctx=canvas.getContext('2d');const crest={barca:'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg',madrid:'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg'};const squads={barca:[['1','Joan García'],['2','João Cancelo'],['3','Alejandro Balde'],['5','Pau Cubarsí'],['15','Christensen'],['6','Gavi'],['8','Pedri'],['21','Frenkie de Jong'],['10','Lamine Yamal'],['11','Raphinha'],['9','Gabriel Jesus']],madrid:[['1','Courtois'],['24','Dumfries'],['16','Konaté'],['4','Huijsen'],['18','Carreras'],['8','Valverde'],['5','Bellingham'],['15','Arda Güler'],['7','Vini Jr.'],['10','Mbappé'],['11','Rodrygo']]};const pics={'Lamine Yamal':'https://commons.wikimedia.org/wiki/Special:FilePath/Lamine%20Yamal%202025.jpg','Mbappé':'https://commons.wikimedia.org/wiki/Special:FilePath/Kylian%20Mbappe%20at%20the%202025%20UEFA%20Super%20Cup.jpg','Vini Jr.':'https://commons.wikimedia.org/wiki/Special:FilePath/Vinicius%20Junior%202025.jpg','Pedri':'https://commons.wikimedia.org/wiki/Special:FilePath/Pedri%202025.jpg','Bellingham':'https://commons.wikimedia.org/wiki/Special:FilePath/Jude%20Bellingham%202025.jpg','Raphinha':'https://commons.wikimedia.org/wiki/Special:FilePath/Raphinha%202025.jpg'};let selectedTeam='barca',players=[],ball={x:60,y:35,vx:0,vy:0,owner:null},controlled=0,running=false,paused=false,matchTime=300,goals={barca:0,madrid:0},joy={x:0,y:0},sprint=false,last=performance.now(),msgTimer=0;const FIELD={w:120,h:70};function resize(){const d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function teamName(t){return t==='barca'?'برشلونة':'ريال مدريد'}function buildRoster(){const r=$('roster');r.innerHTML='';squads[selectedTeam].forEach(p=>{const d=document.createElement('div');d.className='card';const im=document.createElement('img');im.src=pics[p[1]]||('https://ui-avatars.com/api/?name='+encodeURIComponent(p[1])+'&background=26313c&color=fff&size=80');const s=document.createElement('div');s.innerHTML='<div class="num">#'+p[0]+'</div><div class="name">'+p[1]+'</div>';d.append(im,s);r.append(d)})}buildRoster();function selectTeam(t){selectedTeam=t;$('barcaBtn').classList.toggle('active',t==='barca');$('madridBtn').classList.toggle('active',t==='madrid');buildRoster()}$('barcaBtn').addEventListener('click',()=>selectTeam('barca'));$('madridBtn').addEventListener('click',()=>selectTeam('madrid'));document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.tab).classList.add('active')}));function makePlayer(team,i){const dir=team===selectedTeam?1:-1;const f=[[4,0],[14,-18],[14,-6],[14,6],[14,18],[4,-13],[4,0],[4,13],[-9,-18],[-10,0],[-9,18]][i];return{id:i,team:team,x:60+f[0]*dir,y:35+f[1],homeX:60+f[0]*dir,homeY:35+f[1],vx:0,vy:0,name:squads[team][i][1]}}function resetMatch(){players=[];for(let i=0;i<11;i++)players.push(makePlayer(selectedTeam,i));const opp=selectedTeam==='barca'?'madrid':'barca';for(let i=0;i<11;i++)players.push(makePlayer(opp,i));controlled=0;ball={x:players[0].x+2,y:players[0].y,vx:0,vy:0,owner:0};goals={barca:0,madrid:0};matchTime=300;joy={x:0,y:0};sprint=false;updateScore()}function updateScore(){$('homeScore').textContent=teamName(selectedTeam)+' '+goals[selectedTeam];const opp=selectedTeam==='barca'?'madrid':'barca';$('awayScore').textContent=goals[opp]+' '+teamName(opp);$('clock').textContent=String(Math.floor(matchTime/60)).padStart(2,'0')+':'+String(Math.floor(matchTime%60)).padStart(2,'0')}function showMessage(t){const m=$('message');m.textContent=t;m.classList.add('show');msgTimer=1.4}async function startGame(){resetMatch();running=true;paused=false;$('menu').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');$('homeCrest').src=crest[selectedTeam];$('awayCrest').src=crest[selectedTeam==='barca'?'madrid':'barca'];try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();}catch(e){}try{if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}}$('startBtn').addEventListener('click',startGame);$('pauseBtn').addEventListener('click',()=>{paused=!paused;$('pauseBtn').textContent=paused?'▶':'Ⅱ'});function scale(){const top=62,bottom=innerHeight-8,left=8,right=innerWidth-8;const s=Math.min((right-left)/FIELD.w,(bottom-top)/FIELD.h);return{left:left+(right-left-FIELD.w*s)/2,top:top+(bottom-top-FIELD.h*s)/2,s}}function screenPos(x,y){const q=scale();return[q.left+x*q.s,q.top+y*q.s]}function drawField(){const q=scale(),x=q.left,y=q.top,w=FIELD.w*q.s,h=FIELD.h*q.s;ctx.fillStyle='#06170d';ctx.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#138045':'#11753d';ctx.fillRect(x+i*w/12,y,w/12,h)}ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke();ctx.beginPath();ctx.arc(x+w/2,y+h/2,9*q.s,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x+w/2,y+h/2,1.2*q.s,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.fillRect(x-4*q.s,y+h/2-11*q.s,4*q.s,22*q.s);ctx.fillRect(x+w,y+h/2-11*q.s,4*q.s,22*q.s);ctx.strokeRect(x,y+h/2-11*q.s,16*q.s,22*q.s);ctx.strokeRect(x+w-16*q.s,y+h/2-11*q.s,16*q.s,22*q.s);ctx.strokeRect(x,y+h/2-5*q.s,5*q.s,10*q.s);ctx.strokeRect(x+w-5*q.s,y+h/2-5*q.s,5*q.s,10*q.s);drawGoal(x,y+h/2,-1);drawGoal(x+w,y+h/2,1)}function drawGoal(x,y,side){const q=scale(),s=q.s;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x,y-6*s);ctx.lineTo(x+side*5*s,y-6*s);ctx.lineTo(x+side*5*s,y+6*s);ctx.lineTo(x,y+6*s);ctx.stroke();ctx.strokeStyle='#ffffff55';ctx.lineWidth=1;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(x+side*i*s,y-6*s);ctx.lineTo(x+side*i*s,y+6*s);ctx.stroke()}}function drawPlayers(){const q=scale();const sorted=[...players].sort((a,b)=>a.y-b.y);for(const p of sorted){const [sx,sy]=screenPos(p.x,p.y),s=q.s;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(sx,sy+4*s,2*s,.8*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.team==='barca'?'#17469c':'#f2f2f2';ctx.beginPath();ctx.arc(sx,sy,1.35*s,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.team==='barca'?'#e21b3c':'#7d2c2c';ctx.fillRect(sx-1*s,sy-.25*s,2*s,.65*s);if(p.team===selectedTeam&&p.id===controlled){ctx.strokeStyle='#ffd21c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,2.15*s,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffd21c';ctx.font='bold '+Math.max(10,10*s)+'px Arial';ctx.textAlign='center';ctx.fillText(p.name,sx,sy-2.8*s)}}}function drawBall(){const [sx,sy]=screenPos(ball.x,ball.y),s=scale().s;ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(sx,sy+2*s,.9*s,.35*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(sx,sy-.7*s,.85*s,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=1;ctx.stroke()}function clampPlayer(p){p.x=Math.max(2,Math.min(FIELD.w-2,p.x));p.y=Math.max(2,Math.min(FIELD.h-2,p.y))}function moveControlled(dt){const p=players[controlled];if(!p||p.team!==selectedTeam)return;const speed=(sprint?17:10)*dt;p.vx=joy.x*speed;p.vy=joy.y*speed;p.x+=p.vx;p.y+=p.vy;clampPlayer(p);const dx=ball.x-p.x,dy=ball.y-p.y;if(Math.hypot(dx,dy)<2.5&&Math.hypot(ball.vx,ball.vy)<10){ball.owner=controlled;ball.vx=0;ball.vy=0}if(ball.owner===controlled){ball.x=p.x+joy.x*1.8;ball.y=p.y+joy.y*1.8}}function moveAI(dt){for(let i=0;i<players.length;i++){const p=players[i];if(p.team===selectedTeam&&p.id===controlled)continue;let tx=p.homeX,ty=p.homeY;const dist=Math.hypot(ball.x-p.x,ball.y-p.y);if(p.team!==selectedTeam&&dist<25){tx=ball.x;ty=ball.y}else if(p.team===selectedTeam&&dist<12){tx=(p.homeX+ball.x)/2;ty=(p.homeY+ball.y)/2}const dx=tx-p.x,dy=ty-p.y,len=Math.hypot(dx,dy)||1,spd=(p.team===selectedTeam?4.5:5.2)*dt;p.x+=dx/len*Math.min(spd,len);p.y+=dy/len*Math.min(spd,len);clampPlayer(p);if(p.team!==selectedTeam&&dist<1.8&&ball.owner===null){ball.owner=11+p.id;ball.vx=0;ball.vy=0}}}function updateBall(dt){if(ball.owner!==null){const o=players[ball.owner];if(o){ball.x=o.x;ball.y=o.y}}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const drag=Math.pow(.18,dt);ball.vx*=drag;ball.vy*=drag;if(ball.y<1.5||ball.y>FIELD.h-1.5){ball.y=Math.max(1.5,Math.min(FIELD.h-1.5,ball.y));ball.vy*=-.7}for(const p of players){if(Math.hypot(ball.x-p.x,ball.y-p.y)<1.4&&Math.hypot(ball.vx,ball.vy)<9){ball.owner=p.team===selectedTeam?p.id:11+p.id;break}}}if(ball.x<0||ball.x>FIELD.w){const scorer=ball.x<0?'madrid':'barca';const opp=selectedTeam===scorer?scorer:(selectedTeam===scorer?'barca':'madrid');goals[scorer]++;updateScore();showMessage('⚽ هدف لـ '+teamName(scorer)+'!');resetAfterGoal();}}function resetAfterGoal(){for(let i=0;i<players.length;i++){const p=players[i];const base=i<11?makePlayer(selectedTeam,i):makePlayer(selectedTeam==='barca'?'madrid':'barca',i-11);p.x=base.x;p.y=base.y;p.homeX=base.homeX;p.homeY=base.homeY}controlled=0;ball={x:60+(selectedTeam==='barca'?-2:2),y:35,vx:0,vy:0,owner:null}}function kick(type){const p=players[controlled];if(!p)return;const dx=joy.x|| (selectedTeam==='barca'?1:-1),dy=joy.y;const len=Math.hypot(dx,dy)||1;let power=type==='shoot'?34:type==='through'?23:16;if(type==='shoot'&&Math.abs(dx)<.15){return}ball.owner=null;ball.x=p.x+dx/len*1.8;ball.y=p.y+dy/len*1.8;ball.vx=dx/len*power;ball.vy=dy/len*power}function switchPlayer(){let best=-1,bd=1e9;for(let i=0;i<11;i++){const p=players[i],d=Math.hypot(p.x-ball.x,p.y-ball.y);if(d<bd){bd=d;best=i}}if(best>=0)controlled=best}function tackle(){for(let i=11;i<22;i++){const p=players[i];if(Math.hypot(p.x-players[controlled].x,p.y-players[controlled].y)<3){ball.owner=controlled;ball.x=players[controlled].x;ball.y=players[controlled].y;showMessage('افتكاك ناجح');return}}}function update(dt){if(!running||paused)return;matchTime-=dt;if(matchTime<=0){matchTime=0;running=false;showMessage('انتهت المباراة');setTimeout(()=>{ $('menu').classList.remove('hidden');$('hud').classList.add('hidden');$('controls').classList.add('hidden')},1200)}moveControlled(dt);moveAI(dt);updateBall(dt);updateScore();if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)$('message').classList.remove('show')}}function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;drawField();if(running){update(dt)}drawPlayers();drawBall();requestAnimationFrame(frame)}requestAnimationFrame(frame);function setJoy(e){const r=$('joy').getBoundingClientRect();let x=(e.clientX-(r.left+r.width/2))/(r.width/2),y=(e.clientY-(r.top+r.height/2))/(r.height/2);const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}joy={x,y};$('knob').style.transform='translate('+x*32+'px,'+y*32+'px)'}$('joy').addEventListener('pointerdown',e=>{$('joy').setPointerCapture(e.pointerId);setJoy(e)});$('joy').addEventListener('pointermove',e=>{if(e.buttons)setJoy(e)});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('joy').addEventListener(ev,()=>{joy={x:0,y:0};$('knob').style.transform='translate(0,0)'}));$('switchBtn').addEventListener('click',switchPlayer);$('passBtn').addEventListener('click',()=>kick('pass'));$('throughBtn').addEventListener('click',()=>kick('through'));$('shootBtn').addEventListener('click',()=>kick('shoot'));$('tackleBtn').addEventListener('click',tackle);$('runBtn').addEventListener('pointerdown',()=>sprint=true);['pointerup','pointercancel','pointerleave'].forEach(e=>$('runBtn').addEventListener(e,()=>sprint=false));})();</script></body></html>
