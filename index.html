<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>معلوماتي</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#315d78,#07131f 72%);color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:720px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;background:#ffffff14;border:1px solid #ffffff22;border-radius:22px;padding:12px 15px}.brand{font-size:22px;font-weight:900}.stats{display:flex;gap:6px}.pill{background:#0005;border-radius:13px;padding:7px 10px;font-weight:900}.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:25px 10px 18px}.logo{font-size:62px}h1{font-size:38px;margin:3px 0}.hero p{color:#b9cbd8}.card{background:linear-gradient(145deg,#ffffff16,#ffffff08);border:1px solid #ffffff20;border-radius:25px;padding:16px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.level{aspect-ratio:1;border:1px solid #ffffff20;border-radius:18px;background:#ffffff0d;color:#fff;font-size:20px;font-weight:900}.level small{display:block;font-size:10px;color:#a9bfce;margin-top:5px}.level.done{background:#176b54}.level:disabled{opacity:.3}.gamehead{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.back{border:0;border-radius:13px;padding:9px 12px;background:#ffffff14;color:#fff}.topic{text-align:center;color:#b9cbd8;font-size:13px;margin:4px 0 12px}.cluebox{background:#091824;border-radius:18px;padding:13px;margin-bottom:14px}.clueNo{color:#e9bd49;font-weight:900;font-size:13px}.clue{font-size:20px;font-weight:800;line-height:1.5;margin-top:4px}.photo{width:100%;max-height:250px;object-fit:cover;border-radius:16px;margin-top:10px;border:1px solid #ffffff22}.hint{font-size:12px;color:#9fb4c2;text-align:center;margin:8px 0}.grid{display:grid;gap:0;justify-content:center;margin:12px auto 18px;overflow:auto;max-width:100%}.sq{width:40px;height:40px;border:1px solid #385268;background:#0b1b29;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;cursor:pointer;position:relative}.sq.active{background:#263f51;border-color:#e6b942;box-shadow:inset 0 0 0 2px #e6b94255}.sq.filled{color:#ffd86d}.sq.good{background:#176b54;color:#fff}.num{position:absolute;top:1px;right:3px;font-size:8px;color:#8ea8b8}.answerLine{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;min-height:40px;margin:8px 0 10px}.mini{width:36px;height:36px;border:2px solid #4a6579;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900}.native{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}.msg{text-align:center;min-height:25px;margin:8px;font-weight:900}.big{width:100%;border:0;border-radius:15px;padding:15px;margin-top:10px;background:linear-gradient(135deg,#f2c14e,#d89220);color:#18120a;font-size:17px;font-weight:900}.secondary{background:#ffffff13;color:#fff}.win{position:fixed;inset:0;background:#020b13ee;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.win.show{display:flex}.winbox{width:min(430px,100%);text-align:center;background:linear-gradient(145deg,#18334a,#0b1b2a);border:1px solid #ffffff25;border-radius:28px;padding:25px}.emoji{font-size:62px}@media(max-width:430px){.sq{width:34px;height:34px;font-size:17px}.level{font-size:18px}}</style></head><body><main class="app"><div class="top"><div class="brand">🧩 معلوماتي</div><div class="stats"><span class="pill">⭐ <b id="points">0</b></span><span class="pill">🔥 <b id="streak">0</b></span></div></div><section id="home" class="screen active"><div class="hero"><div class="logo">🧠</div><h1>معلوماتي</h1><p>ألغاز • كلمات متقاطعة • أسئلة بالصور</p></div><div class="card"><h2>المراحل</h2><div id="levels" class="levels"></div></div></section><section id="game" class="screen"><div class="gamehead"><button class="back" id="back">← المراحل</button><b>المرحلة <span id="num"></span></b><span class="pill">⭐ <span id="gpoints">0</span></span></div><div class="topic" id="topic"></div><div id="clue"></div><div class="card"><div class="hint">اضغط على خانة لاختيار الكلمة، واضغط مرة أخرى لتغيير الاتجاه</div><div id="grid" class="grid"></div><div id="answerLine" class="answerLine"></div><input id="native" class="native" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off"><div id="msg" class="msg"></div><button class="big secondary" id="clear">مسح</button></div></section></main><div id="win" class="win"><div class="winbox"><div class="emoji">🎉</div><h2>أحسنت!</h2><p id="wintext"></p><button class="big" id="next">المرحلة التالية</button><button class="big secondary" id="winback">العودة للمراحل</button></div></div><script>const IMG={elephant:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Elephant_calf.jpg',dolphin:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Common_dolphin.jpg',mask:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Mask_of_Tutankhamun.svg',lightning:'https://commons.wikimedia.org/wiki/Special:Redirect/file/LightningImage.jpg'};const stages=[{title:'عالم الحيوان',words:[['فيل','حيوان ضخم يتميز بخرطوم طويل'],['دولفين','ثديي بحري ذكي يستخدم تحديد الموقع بالصدى',IMG.dolphin],['قرد','حيوان من الرئيسيات'],['بطريق','طائر لا يطير ويعيش في البيئات الباردة'],['باندا','حيوان مشهور بحبه للخيزران']]},{title:'ألغاز بالصور',words:[['فيل','ما الحيوان الظاهر في الصورة؟',IMG.elephant],['دولفين','ما الكائن البحري الظاهر في الصورة؟',IMG.dolphin],['برق','ما الظاهرة الجوية الظاهرة في الصورة؟',IMG.lightning],['قناع','ما الشيء الذهبي الظاهر في الصورة؟',IMG.mask],['مصر','الدولة التي ارتبط بها القناع الشهير',IMG.mask]]},{title:'الفضاء',words:[['هبل','تلسكوب فضائي شهير يراقب الكون'],['فلك','العلم الذي يدرس الأجرام السماوية'],['قمر','جسم يدور حول كوكب'],['مجرة','تجمع هائل من النجوم والغاز والغبار'],['نجوم','أجرام مضيئة في السماء']]},{title:'مصر القديمة',words:[['فرعون','لقب حاكم مصر القديمة'],['مقبرة','مكان دفن الموتى'],['مومياء','جثمان حُفظ بطريقة خاصة'],['ملك','حاكم أو صاحب سلطة'],['مصر','البلد الذي ازدهرت فيه الحضارة الفرعونية']]},{title:'الطقس والسماء',words:[['برق','تفريغ كهربائي مرئي في الغلاف الجوي',IMG.lightning],['رعد','صوت يصاحب العواصف الرعدية'],['مطر','قطرات ماء تسقط من السحب'],['سحابة','تجمع من قطرات الماء أو بلورات الجليد في الجو'],['صاعقة','تفريغ كهربائي قوي يصل إلى الأرض']]},{title:'تفكير ومعلومات',words:[['بوصلة','أداة تساعد على معرفة الاتجاهات'],['نيل','نهر شهير يمر في مصر'],['محيط','مسطح مائي هائل يحيط بالقارات'],['شمس','النجم الأقرب إلى الأرض'],['هرم','بناء ذو جوانب مثلثة اشتهرت به مصر القديمة']]},{title:'علوم',words:[['كهرباء','نوع من الطاقة يرتبط بالشحنات الكهربائية'],['خلية','وحدة أساسية في بناء الكائنات الحية'],['ضوء','ما يصل إلى العين من مصادر مضيئة'],['صوت','موجة تنتقل عبر وسط مادي'],['مجرة','نظام هائل يضم نجوما كثيرة']]},{title:'تحدي سريع',words:[['اسد','حيوان مفترس يلقب بملك الغابة'],['نسر','طائر جارح قوي'],['بحر','مسطح مائي أصغر من المحيط عادة'],['قمر','تابع طبيعي لكوكب'],['عود','آلة موسيقية وترية عربية']]}];let current=0,activeWord=0,direction=null,answer='',points=+localStorage.mpoints||0,streak=+localStorage.mstreak||0,done=JSON.parse(localStorage.mdone||'[]'),solved={};const $=id=>document.getElementById(id);function norm(s){return s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ـ/g,'').replace(/\s/g,'')}function save(){localStorage.mpoints=points;localStorage.mstreak=streak;localStorage.mdone=JSON.stringify(done);$('points').textContent=points;$('streak').textContent=streak}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function levels(){let h='';stages.forEach((s,i)=>{let locked=i>0&&!done.includes(i-1);h+=`<button class="level ${done.includes(i)?'done':''}" ${locked?'disabled':''} data-i="${i}">${done.includes(i)?'✓':i+1}<small>${s.title}</small></button>`});$('levels').innerHTML=h;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>open(+b.dataset.i))}function open(i){current=i;activeWord=0;direction=null;answer='';solved={};$('num').textContent=i+1;$('topic').textContent=stages[i].title;$('msg').textContent='';$('gpoints').textContent=points;show('game');render();setTimeout(()=>focusInput(),150)}function canPlace(g,w,r,c,d){for(let k=0;k<w.length;k++){let rr=r+(d==='v'?k:0),cc=c+(d==='h'?k:0);if(rr<0||cc<0||rr>=25||cc>=25)return false;if(g[rr][cc]&&g[rr][cc]!==w[k])return false}return true}function build(){let ws=stages[current].words.map(x=>norm(x[0])),n=25,g=Array.from({length:n},()=>Array(n).fill('')),placed=[];function put(w,r,c,d){if(!canPlace(g,w,r,c,d))return false;for(let k=0;k<w.length;k++){let rr=r+(d==='v'?k:0),cc=c+(d==='h'?k:0);g[rr][cc]=w[k]}placed.push({w,r,c,d});return true}put(ws[0],12,8,'h');for(let i=1;i<ws.length;i++){let w=ws[i],ok=false;for(const p of placed){for(let a=0;a<w.length&&!ok;a++)for(let b=0;b<p.w.length&&!ok;b++)if(w[a]===p.w[b]){let d=p.d==='h'?'v':'h',r=p.r+(p.d==='v'?b:0)-(d==='v'?a:0),c=p.c+(p.d==='h'?b:0)-(d==='h'?a:0);if(put(w,r,c,d))ok=true}}if(!ok){let p=placed[placed.length-1];let d=p.d==='h'?'v':'h',r=p.r+(d==='v'?p.w.length+1:0),c=p.c+(d==='h'?p.w.length+1:0);put(w,r,c,d)}}let minR=n,maxR=0,minC=n,maxC=0;placed.forEach(p=>{for(let k=0;k<p.w.length;k++){let r=p.r+(p.d==='v'?k:0),c=p.c+(p.d==='h'?k:0);minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c)}});return{g,placed,minR,maxR,minC,maxC}}function belongs(p,r,c){return p.d==='h'?r===p.r&&c>=p.c&&c<p.c+p.w.length:c===p.c&&r>=p.r&&r<p.r+p.w.length}function render(){let s=stages[current],lay=build(),rows=lay.maxR-lay.minR+1,cols=lay.maxC-lay.minC+1;$('grid').style.gridTemplateColumns=`repeat(${cols},40px)`;let html='';for(let r=lay.minR;r<=lay.maxR;r++)for(let c=lay.minC;c<=lay.maxC;c++){if(!lay.g[r][c])continue;let hits=lay.placed.map((p,i)=>belongs(p,r,c)?i:-1).filter(i=>i>=0),active=hits.includes(activeWord),ch='';if(active){let p=lay.placed[active],pos=p.d==='h'?c-p.c:r-p.r;ch=norm(answer)[pos]||''}html+=`<div class="sq ${active?'active':''} ${solved[activeWord]?'good':''}" data-r="${r}" data-c="${c}">${ch}</div>`}$('grid').innerHTML=html;document.querySelectorAll('.sq').forEach(x=>x.onclick=()=>select(+x.dataset.r,+x.dataset.c,lay));renderClue(lay);renderAnswer()}function select(r,c,lay){let hits=[];lay.placed.forEach((p,i)=>{if(belongs(p,r,c))hits.push(i)});if(!hits.length)return;if(hits.length>1){if(direction===null||activeWord!==hits[0])activeWord=hits[0];else activeWord=hits.find(i=>i!==activeWord)??hits[0]}else activeWord=hits[0];direction=lay.placed[activeWord].d;answer='';if(solved[activeWord])answer=norm(stages[current].words[activeWord][0]);render();focusInput()}function renderClue(lay){let w=stages[current].words[activeWord],p=lay.placed[activeWord],label=p.d==='h'?'أفقي':'عمودي';$('clue').innerHTML=`<div class="cluebox"><div class="clueNo">${label} • السؤال ${activeWord+1}</div><div class="clue">${w[1]}</div>${w[2]?`<img class="photo" src="${w[2]}" alt="صورة السؤال">`:''}</div>`}function renderAnswer(){let w=norm(stages[current].words[activeWord][0]);$('answerLine').innerHTML=[...w].map((x,i)=>`<div class="mini">${norm(answer)[i]||''}</div>`).join('')}function focusInput(){let n=$('native');n.value=answer;n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch(e){}}function autoCheck(){let w=norm(stages[current].words[activeWord][0]);answer=norm($('native').value).slice(0,w.length);$('native').value=answer;renderAnswer();render();if(answer.length===w.length){if(answer===w){solved[activeWord]=true;points+=10;streak++;save();$('msg').textContent='✅ صحيح';setTimeout(()=>nextWord(),250)}else{$('msg').textContent='❌ غير صحيح';streak=0;save();setTimeout(()=>{answer='';$('native').value='';render();focusInput()},400)}}}function nextWord(){let all=stages[current].words.every((_,i)=>solved[i]);if(all){if(!done.includes(current))done.push(current);points+=50;save();$('wintext').textContent='أكملت المرحلة بنجاح — +50 نقطة';$('win').classList.add('show')}else{let n=stages[current].words.findIndex((_,i)=>!solved[i]);if(n>=0){activeWord=n;answer='';$('native').value='';$('msg').textContent='';render();focusInput()}}}$('native').addEventListener('input',autoCheck);$('clear').onclick=()=>{answer='';$('native').value='';$('msg').textContent='';render();focusInput()};$('back').onclick=()=>{levels();show('home')};$('winback').onclick=()=>{$('win').classList.remove('show');levels();show('home')};$('next').onclick=()=>{$('win').classList.remove('show');let n=current+1;if(n<stages.length)open(n);else{levels();show('home')}};save();levels();</script></body></html>
