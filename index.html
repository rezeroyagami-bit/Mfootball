<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>معلوماتي</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#10243b,#06121f);color:#fff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}button{font-family:inherit;cursor:pointer}.app{max-width:620px;margin:auto;min-height:100vh;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;background:#ffffff12;border:1px solid #ffffff18;border-radius:18px;padding:12px 14px}.logo{font-size:22px;font-weight:900}.stats{display:flex;gap:8px}.pill{background:#0004;border-radius:12px;padding:7px 10px;font-weight:bold}.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:35px 10px 18px}.hero h1{font-size:42px;margin:8px 0}.hero p{color:#b8c8d7}.card{background:#ffffff0d;border:1px solid #ffffff18;border-radius:24px;padding:18px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.level{aspect-ratio:1;border:1px solid #ffffff18;border-radius:16px;background:#ffffff0c;color:#fff;font-size:19px;font-weight:bold}.level.done{background:#176b54}.level:disabled{opacity:.35}.gamehead{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.back{border:0;background:#ffffff12;color:#fff;border-radius:12px;padding:9px 13px}.question{font-size:22px;line-height:1.55;text-align:center;margin:10px 0 6px}.hint{font-size:13px;color:#9fb1c3;text-align:center}.letters{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:18px 0}.cell{width:43px;height:43px;border-radius:9px;border:2px solid #58728b;background:#0a1724;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900}.cell.filled{border-color:#e7ad32;color:#ffd76d}.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.key{border:0;border-radius:10px;background:#ffffff12;color:#fff;min-height:45px;font-size:18px;font-weight:bold}.key:active{transform:scale(.94)}.big{width:100%;border:0;border-radius:17px;padding:16px;margin-top:10px;background:#e7ad32;color:#17110a;font-size:19px;font-weight:900}.secondary{background:#ffffff14;color:#fff}.msg{text-align:center;min-height:30px;font-weight:bold;margin:10px}.win{position:fixed;inset:0;background:#06111eea;display:none;align-items:center;justify-content:center;padding:25px;z-index:5}.win.show{display:flex}.winbox{text-align:center;max-width:420px;width:100%;background:#10243a;border:1px solid #ffffff20;border-radius:25px;padding:25px}.emoji{font-size:58px}@media(max-width:390px){.cell{width:38px;height:38px}.key{min-height:41px;font-size:16px}.hero h1{font-size:35px}}</style></head><body><main class="app"><div class="top"><div class="logo">🧠 معلوماتي</div><div class="stats"><span class="pill">⭐ <b id="points">0</b></span><span class="pill">🔥 <b id="streak">0</b></span></div></div><section id="home" class="screen active"><div class="hero"><h1>معلوماتي</h1><p>لعبة كلمات عربية ثقافية</p></div><div class="card"><h2>اختر مرحلة</h2><div id="levels" class="levels"></div></div></section><section id="game" class="screen"><div class="gamehead"><button class="back" id="back">← المراحل</button><b>المرحلة <span id="num"></span></b><span class="pill">⭐ <span id="gpoints">0</span></span></div><div class="card"><div class="question" id="question"></div><div class="hint" id="hint"></div><div id="letters" class="letters"></div><div id="msg" class="msg"></div><div id="keyboard" class="keyboard"></div><button class="big secondary" id="clear">مسح الإجابة</button><button class="big" id="submit">تحقق ✓</button></div></section></main><div id="win" class="win"><div class="winbox"><div class="emoji">🎉</div><h2>إجابة صحيحة!</h2><p id="wintext"></p><button class="big" id="next">المرحلة التالية</button><button class="big secondary" id="winback">العودة للمراحل</button></div></div><script>const data=[['عاصمة الجزائر','مدينة تحمل اسم الدولة','الجزائر'],['الكوكب الأحمر','كوكب يشتهر بلونه الأحمر','المريخ'],['أكبر محيط','أكبر محيطات العالم مساحة','الهادئ'],['حيوان الباندا','حيوان يأكل الخيزران','الباندا'],['كاتب البؤساء','مؤلف رواية البؤساء','فيكتورهوغو'],['لغة القرآن','اللغة التي نزل بها القرآن','العربية'],['قارة الأهرامات','قارة توجد فيها أهرامات الجيزة','افريقيا'],['عاصمة اليابان','مدينة يابانية ضخمة','طوكيو'],['أقرب نجم','أقرب نجم إلى الأرض','الشمس'],['ملك الغابة','لقب مشهور لحيوان مفترس','الاسد'],['آلة لها أوتار','آلة موسيقية عربية','العود'],['أطول نهر','نهر شهير في أفريقيا','النيل'],['علم النجوم','علم يدرس الأجرام السماوية','الفلك'],['مؤلف الأغاني','صاحب كتاب الأغاني','الاصفهاني'],['عاصمة فرنسا','مدينة النور','باريس'],['أكبر قارة','أكبر القارات مساحة','اسيا'],['مخترع المصباح','عالم ارتبط باختراع المصباح','اديسون'],['كوكب الحلقات','كوكب مشهور بحلقاته','زحل'],['لغة الضاد','اسم مشهور للعربية','العربية'],['رياضة المستديرة','رياضة يلعبها فريقان','كرةالقدم']];let current=0,answer='',points=+(localStorage.mpoints||0),streak=+(localStorage.mstreak||0),done=JSON.parse(localStorage.mdone||'[]');const ar='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');const $=x=>document.getElementById(x);function save(){localStorage.mpoints=points;localStorage.mstreak=streak;localStorage.mdone=JSON.stringify(done);$('points').textContent=points;$('streak').textContent=streak;$('gpoints').textContent=points}function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(x).classList.add('active')}function levels(){let h='';data.forEach((x,i)=>{let locked=i>0&&!done.includes(i-1);h+=`<button class="level" ${locked?'disabled':''} data-i="${i}">${done.includes(i)?'✓':i+1}</button>`});$('levels').innerHTML=h;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>open(+b.dataset.i))}function norm(s){return s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ـ/g,'').replace(/\s/g,'')}function open(i){current=i;answer='';$('num').textContent=i+1;$('question').textContent=data[i][0];$('hint').textContent=data[i][1];$('msg').textContent='';show('game');render()}function render(){let word=data[current][2],a=norm(answer);$('letters').innerHTML=[...word].map((_,i)=>`<div class="cell ${a[i]?'filled':''}">${a[i]||''}</div>`).join('');let keys=[...new Set([...norm(word),...ar])].sort(()=>Math.random()-.5);$('keyboard').innerHTML=keys.map(c=>`<button class="key" data-k="${c}">${c}</button>`).join('');document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{if(norm(answer).length<word.length){answer+=k.dataset.k;render()}})}function check(){if(norm(answer)===norm(data[current][2])){if(!done.includes(current)){points+=10;done.push(current)}streak++;save();$('wintext').textContent='الإجابة: '+data[current][2]+' — +10 نقاط';$('win').classList.add('show')}else{$('msg').textContent='❌ إجابة غير صحيحة، حاول مرة أخرى';streak=0;save()}}$('submit').onclick=check;$('clear').onclick=()=>{answer='';$('msg').textContent='';render()};$('back').onclick=()=>{levels();show('home')};$('winback').onclick=()=>{$('win').classList.remove('show');levels();show('home')};$('next').onclick=()=>{$('win').classList.remove('show');current+1<data.length?open(current+1):(levels(),show('home'))};save();levels();</script></body></html>
