<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>معلوماتي</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#315d78,#07131f 72%);color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:720px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;background:#ffffff14;border:1px solid #ffffff22;border-radius:22px;padding:12px 15px;box-shadow:0 12px 35px #0006;backdrop-filter:blur(14px)}.brand{font-size:22px;font-weight:900}.stats{display:flex;gap:6px}.pill{background:#0005;border-radius:13px;padding:7px 10px;font-weight:900}.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:25px 10px 18px}.logo{font-size:62px;filter:drop-shadow(0 10px 18px #0007)}h1{font-size:38px;margin:3px 0;background:linear-gradient(#fff,#b9d5e7);-webkit-background-clip:text;color:transparent}.hero p{color:#b9cbd8}.card{background:linear-gradient(145deg,#ffffff16,#ffffff08);border:1px solid #ffffff20;border-radius:25px;padding:16px;box-shadow:0 18px 50px #0006;backdrop-filter:blur(14px)}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.level{aspect-ratio:1;border:1px solid #ffffff20;border-radius:18px;background:#ffffff0d;color:#fff;font-size:20px;font-weight:900;position:relative}.level small{display:block;font-size:10px;color:#a9bfce;margin-top:5px}.level.done{background:#176b54}.level:disabled{opacity:.3}.gamehead{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.back{border:0;border-radius:13px;padding:9px 12px;background:#ffffff14;color:#fff}.topic{text-align:center;color:#b9cbd8;font-size:13px;margin:4px 0 12px}.cluebox{background:#091824;border-radius:18px;padding:13px;margin-bottom:14px}.clueNo{color:#e9bd49;font-weight:900;font-size:13px}.clue{font-size:20px;font-weight:800;line-height:1.5;margin-top:4px}.photo{width:100%;max-height:250px;object-fit:cover;border-radius:16px;margin-top:10px;border:1px solid #ffffff22}.grid{display:grid;gap:3px;justify-content:center;margin:12px auto 18px;direction:ltr}.sq{width:39px;height:39px;border-radius:6px;border:1px solid #385268;background:#0b1b29;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;cursor:pointer;user-select:none}.sq.block{visibility:hidden;background:transparent;border-color:transparent;cursor:default}.sq.active{border-color:#e6b942;box-shadow:0 0 0 2px #e6b94255}.sq.filled{background:#1d2e3b;color:#ffd86d}.sq.good{background:#176b54;color:#fff}.answerLine{display:none}.keyboard{display:none}.big{width:100%;border:0;border-radius:15px;padding:15px;margin-top:10px;background:linear-gradient(135deg,#f2c14e,#d89220);color:#18120a;font-size:17px;font-weight:900}.secondary{background:#ffffff13;color:#fff}.msg{text-align:center;min-height:25px;margin:8px;font-weight:900}.hint{text-align:center;color:#9eb5c5;font-size:12px;margin:6px 0 2px}.nativeInput{position:fixed;width:2px;height:2px;opacity:.01;right:2px;bottom:2px;border:0;padding:0;font-size:16px;z-index:-1}.win{position:fixed;inset:0;background:#020b13ee;display:none;align-items:center;justify-content:center;padding:20px;z-index:9;backdrop-filter:blur(8px)}.win.show{display:flex}.winbox{width:min(430px,100%);text-align:center;background:linear-gradient(145deg,#18334a,#0b1b2a);border:1px solid #ffffff25;border-radius:28px;padding:25px;box-shadow:0 20px 70px #0008}.emoji{font-size:62px}.mode{display:inline-block;background:#e6b94222;color:#ffd86d;padding:6px 10px;border-radius:12px;font-size:12px;font-weight:900;margin-bottom:8px}@media(max-width:430px){.sq{width:32px;height:32px;font-size:17px}}
</style></head><body><main class="app"><div class="top"><div class="brand">🧩 معلوماتي</div><div class="stats"><span class="pill">⭐ <b id="points">0</b></span><span class="pill">🔥 <b id="streak">0</b></span></div></div><section id="home" class="screen active"><div class="hero"><div class="logo">🧠</div><h1>معلوماتي</h1><p>ألغاز • كلمات متقاطعة • أسئلة بالصور</p></div><div class="card"><h2>المراحل</h2><div id="levels" class="levels"></div></div></section><section id="game" class="screen"><div class="gamehead"><button class="back" id="back">← المراحل</button><b>المرحلة <span id="num"></span></b><span class="pill">⭐ <span id="gpoints">0</span></span></div><div class="topic" id="topic"></div><div id="clues"></div><div class="card"><div class="mode">اضغط على أي خط أفقي أو عمودي لرؤية السؤال والصورة</div><div id="grid" class="grid"></div><div id="msg" class="msg"></div><div class="hint">اكتب الإجابة من لوحة مفاتيح هاتفك</div><input id="nativeInput" class="nativeInput" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" lang="ar" dir="rtl"><button class="big secondary" id="clear">مسح الإجابة</button><button class="big" id="submit">تحقق ✓</button></div></section></main><div id="win" class="win"><div class="winbox"><div class="emoji">🎉</div><h2>أحسنت!</h2><p id="wintext"></p><button class="big" id="next">المرحلة التالية</button><button class="big secondary" id="winback">العودة للمراحل</button></div></div><script>
const IMG={elephant:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Elephant_calf.jpg',dolphin:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Common_dolphin.jpg',mask:'https://commons.wikimedia.org/wiki/Special:Redirect/file/Mask_of_Tutankhamun.svg',lightning:'https://commons.wikimedia.org/wiki/Special:Redirect/file/LightningImage.jpg'};
const stages=[
{title:'عالم الحيوان',words:[['فيل','حيوان ضخم يتميز بخرطوم طويل',null],['باندا','حيوان مشهور بحبه للخيزران',null],['دولفين','ثديي بحري ذكي يستخدم تحديد الموقع بالصدى',IMG.dolphin],['بطريق','طائر لا يطير ويعيش في البيئات الباردة',null],['قرد','حيوان من الرئيسيات',null]]},
{title:'ألغاز بالصور',words:[['فيل','ما الحيوان الظاهر في الصورة؟',IMG.elephant],['توت','اسم الفرعون صاحب القناع الذهبي الشهير',IMG.mask],['دولفين','ما الكائن البحري الظاهر في الصورة؟',IMG.dolphin],['برق','ما الظاهرة الجوية الظاهرة في الصورة؟',IMG.lightning],['قناع','شيء ذهبي شهير يرتبط بفرعون مصري',IMG.mask]]},
{title:'الفضاء',words:[['هبل','تلسكوب فضائي شهير يراقب الكون',null],['مجرة','تجمع هائل من النجوم والغاز والغبار',null],['قمر','جسم يدور حول كوكب',null],['فلك','العلم الذي يدرس الأجرام السماوية',null],['نجوم','أجرام مضيئة في السماء',null]]},
{title:'مصر القديمة',words:[['فرعون','لقب حاكم مصر القديمة',null],['مومياء','جثمان حُفظ بطريقة خاصة في مصر القديمة',null],['ذهب','معدن ثمين استُخدم في القناع الملكي',null],['مقبرة','مكان دفن الموتى',null],['توت','الاسم الأول للملك الشاب صاحب القناع الشهير',null]]},
{title:'الطقس والسماء',words:[['برق','تفريغ كهربائي مرئي في الغلاف الجوي',IMG.lightning],['رعد','صوت يصاحب العواصف الرعدية',null],['مطر','قطرات ماء تسقط من السحب',null],['سحاب','تجمع من قطرات الماء أو بلورات الجليد في الجو',null],['صاعقة','تفريغ كهربائي قوي يصل إلى الأرض',null]]},
{title:'تفكير ومعلومات',words:[['بوصلة','أداة تساعد على معرفة الاتجاهات',null],['محيط','مسطح مائي هائل يحيط بالقارات',null],['هرم','بناء ذو جوانب مثلثة اشتهرت به مصر القديمة',null],['نيل','نهر شهير يمر في مصر',null],['شمس','النجم الأقرب إلى الأرض',null]]},
{title:'علوم',words:[['كهرباء','نوع من الطاقة يرتبط بالشحنات الكهربائية',null],['خلية','وحدة أساسية في بناء الكائنات الحية',null],['ضوء','ما يصل إلى العين من مصادر مضيئة',null],['صوت','موجة تنتقل عبر وسط مادي',null],['مجرة','نظام هائل يضم نجوما كثيرة',null]]},
{title:'تحدي سريع',words:[['اسد','حيوان مفترس يلقب بملك الغابة',null],['عود','آلة موسيقية وترية عربية',null],['نسر','طائر جارح قوي',null],['بحر','مسطح مائي أصغر من المحيط عادة',null],['قمر','تابع طبيعي لكوكب',null]]}
];
let current=0,activeWord=0,answer='',points=+localStorage.mpoints||0,streak=+localStorage.mstreak||0,done=JSON.parse(localStorage.mdone||'[]');const $=id=>document.getElementById(id);let ac;const input=$('nativeInput');
function norm(s){return s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ـ/g,'').replace(/\s/g,'')}
function save(){localStorage.mpoints=points;localStorage.mstreak=streak;localStorage.mdone=JSON.stringify(done);$('points').textContent=points;$('streak').textContent=streak}
function tone(type){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=type==='win'?880:type==='bad'?180:620;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.05,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.12);o.start();o.stop(ac.currentTime+.14)}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function levels(){let h='';stages.forEach((s,i)=>{let locked=i>0&&!done.includes(i-1);h+=`<button class="level ${done.includes(i)?'done':''}" ${locked?'disabled':''} data-i="${i}">${done.includes(i)?'✓':i+1}<small>${s.title}</small></button>`});$('levels').innerHTML=h;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>open(+b.dataset.i))}
function open(i){current=i;activeWord=0;answer='';$('num').textContent=i+1;$('topic').textContent=stages[i].title;$('msg').textContent='';$('gpoints').textContent=points;show('game');render();setTimeout(focusKeyboard,100);tone('tap')}
function makeLayout(){let ws=stages[current].words.map(x=>norm(x[0])),n=15,g=Array.from({length:n},()=>Array(n).fill('')),placed=[];function put(w,r,c,d){for(let k=0;k<w.length;k++){let rr=r+(d==='v'?k:0),cc=c+(d==='h'?k:0);if(rr<0||cc<0||rr>=n||cc>=n)return false;let old=g[rr][cc];if(old&&old!==w[k])return false}for(let k=0;k<w.length;k++){let rr=r+(d==='v'?k:0),cc=c+(d==='h'?k:0);g[rr][cc]=w[k]}placed.push({w,r,c,d});return true}put(ws[0],7,3,'h');for(let i=1;i<ws.length;i++){let w=ws[i],ok=false;for(let p of placed){for(let a=0;a<w.length&&!ok;a++)for(let b=0;b<p.w.length&&!ok;b++)if(w[a]===p.w[b]){let d=p.d==='h'?'v':'h',r=p.r+(p.d==='v'?b:0)-(d==='v'?a:0),c=p.c+(p.d==='h'?b:0)-(d==='h'?a:0);ok=put(w,r,c,d)}}if(!ok)put(w,1+i*2,1,'h')}let minR=n,maxR=0,minC=n,maxC=0;placed.forEach(p=>{for(let k=0;k<p.w.length;k++){let r=p.r+(p.d==='v'?k:0),c=p.c+(p.d==='h'?k:0);minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c)}});return{g,placed,minR,maxR,minC,maxC}}
function render(){let s=stages[current],lay=makeLayout(),p=lay.placed[activeWord],w=s.words[activeWord];$('clues').innerHTML=`<div class="cluebox"><div class="clueNo">السؤال ${activeWord+1} • ${p.d==='h'?'أفقي':'عمودي'}</div><div class="clue">${w[1]}</div>${w[2]?`<img class="photo" src="${w[2]}" alt="صورة السؤال">`:''}</div>`;let rows=lay.maxR-lay.minR+1,cols=lay.maxC-lay.minC+1;$('grid').style.gridTemplateColumns=`repeat(${cols},39px)`;let cells=[];for(let r=lay.minR;r<=lay.maxR;r++)for(let c=lay.minC;c<=lay.maxC;c++){let v=lay.g[r][c];if(v){let filled='';lay.placed.forEach((pp,idx)=>{let a=norm(s.words[idx][0]),pos=pp.d==='h'?c-pp.c:r-pp.r;if(idx===activeWord&&((pp.d==='h'&&r===pp.r&&pos>=0&&pos<a.length)||(pp.d==='v'&&c===pp.c&&pos>=0&&pos<a.length)))filled=norm(answer)[pos]||''});cells.push(`<div class="sq ${filled?'filled':''} ${cellBelongs(lay,r,c,activeWord)?'active':''}" data-r="${r}" data-c="${c}">${filled}</div>`)}else cells.push('<div class="sq block"></div>')}$('grid').innerHTML=cells.join('');document.querySelectorAll('.sq:not(.block)').forEach(x=>x.onclick=()=>{selectCell(lay,+x.dataset.r,+x.dataset.c)});input.value=answer;}
function cellBelongs(lay,r,c,idx){let p=lay.placed[idx];if(!p)return false;return p.d==='h'?r===p.r&&c>=p.c&&c<p.c+p.w.length:c===p.c&&r>=p.r&&r<p.r+p.w.length}
function selectCell(lay,r,c){let hit=-1,pos=0;lay.placed.forEach((p,i)=>{if(cellBelongs(lay,r,c,i)){hit=i;pos=p.d==='h'?c-p.c:r-p.r}});if(hit>=0){activeWord=hit;answer=norm(stages[current].words[hit][0]).slice(0,pos);render();focusKeyboard();tone('tap')}}
function focusKeyboard(){input.focus();try{input.setSelectionRange(input.value.length,input.value.length)}catch(e){}}
input.addEventListener('input',()=>{let w=norm(stages[current].words[activeWord][0]);answer=norm(input.value).slice(0,w.length);input.value=answer;render()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}if(e.key==='Backspace'&&answer.length===0){e.preventDefault()}});
function check(){let w=stages[current].words[activeWord][0];if(norm(answer)===norm(w)){points+=10;streak++;save();$('msg').textContent='✅ صحيح';tone('win');setTimeout(()=>{if(activeWord<stages[current].words.length-1){activeWord++;answer='';$('msg').textContent='';render();focusKeyboard()}else winStage()},350)}else{$('msg').textContent='❌ جرّب مرة أخرى';streak=0;save();tone('bad');focusKeyboard()}}
function winStage(){if(!done.includes(current))done.push(current);$('wintext').textContent='أكملت المرحلة بنجاح — +50 نقطة';points+=50;save();$('win').classList.add('show')}
$('submit').onclick=check;$('clear').onclick=()=>{answer='';input.value='';$('msg').textContent='';render();focusKeyboard()};$('back').onclick=()=>{levels();show('home')};$('winback').onclick=()=>{$('win').classList.remove('show');levels();show('home')};$('next').onclick=()=>{$('win').classList.remove('show');let n=current+1;if(n<stages.length)open(n);else{levels();show('home')}};save();levels();
</script></body></html>
