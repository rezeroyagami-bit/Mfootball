<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>معلوماتي</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#315d78,#07131f 72%);color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:720px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;background:#ffffff14;border:1px solid #ffffff22;border-radius:22px;padding:12px 15px}.brand{font-size:22px;font-weight:900}.stats{display:flex;gap:6px}.pill{background:#0005;border-radius:13px;padding:7px 10px;font-weight:900}.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:25px 10px 18px}.logo{font-size:62px}h1{font-size:38px;margin:3px 0}.hero p{color:#b9cbd8}.card{background:linear-gradient(145deg,#ffffff16,#ffffff08);border:1px solid #ffffff20;border-radius:25px;padding:16px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.level{aspect-ratio:1;border:1px solid #ffffff20;border-radius:18px;background:#ffffff0d;color:#fff;font-size:20px;font-weight:900}.level small{display:block;font-size:10px;color:#a9bfce;margin-top:5px}.level.done{background:#176b54}.level:disabled{opacity:.3}.gamehead{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.back{border:0;border-radius:13px;padding:9px 12px;background:#ffffff14;color:#fff}.topic{text-align:center;color:#b9cbd8;font-size:13px;margin:4px 0 12px}.cluebox{background:#091824;border-radius:18px;padding:13px;margin-bottom:14px}.clueNo{color:#e9bd49;font-weight:900;font-size:13px}.clue{font-size:19px;font-weight:800;line-height:1.5;margin-top:4px}.hint{text-align:center;color:#9fb4c2;font-size:12px;margin:5px 0 12px}.board{display:flex;justify-content:center;padding:12px;margin-bottom:15px;overflow:auto}.grid{--cell:38px;display:grid;gap:0;justify-content:center;touch-action:manipulation}.void{width:var(--cell);height:var(--cell);background:transparent}.sq{width:var(--cell);height:var(--cell);border:1px solid #718796;background:#102b3a;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;cursor:pointer;border-radius:0}.sq.active{background:#304d60;border-color:#e6b942;box-shadow:inset 0 0 0 2px #e6b942;z-index:2}.sq.good{background:#176b54;color:#fff}.native{position:fixed;opacity:0;width:1px;height:1px;left:0;bottom:0;border:0;padding:0}.msg{text-align:center;min-height:25px;margin:6px;font-weight:900}.big{width:100%;border:0;border-radius:15px;padding:15px;margin-top:8px;background:linear-gradient(135deg,#f2c14e,#d89220);color:#18120a;font-size:17px;font-weight:900}.secondary{background:#ffffff13;color:#fff}.win{position:fixed;inset:0;background:#020b13ee;display:none;align-items:center;justify-content:center;padding:20px;z-index:9}.win.show{display:flex}.winbox{width:min(430px,100%);text-align:center;background:linear-gradient(145deg,#18334a,#0b1b2a);border:1px solid #ffffff25;border-radius:28px;padding:25px}.emoji{font-size:62px}@media(max-width:430px){.grid{--cell:32px}.sq{font-size:16px}.board{padding:5px}.level{font-size:18px}}
</style></head><body>
<main class="app"><div class="top"><div class="brand">🧩 معلوماتي</div><div class="stats"><span class="pill">⭐ <b id="points">0</b></span><span class="pill">🔥 <b id="streak">0</b></span></div></div>
<section id="home" class="screen active"><div class="hero"><div class="logo">🧠</div><h1>معلوماتي</h1><p>ألغاز • كلمات متقاطعة • أسئلة بالصور</p></div><div class="card"><h2>المراحل</h2><div id="levels" class="levels"></div></div></section>
<section id="game" class="screen"><div class="gamehead"><button class="back" id="back">← المراحل</button><b>المرحلة <span id="num"></span></b><span class="pill">⭐ <span id="gpoints">0</span></span></div><div class="topic" id="topic"></div><div id="clue"></div><div class="card"><div class="hint">اختر الكلمة ثم اكتب الإجابة. الحروف المشتركة تظهر في المربعات المتداخلة.</div><div class="board"><div id="grid" class="grid"></div></div><input id="native" class="native" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="off"><div id="msg" class="msg"></div><button class="big secondary" id="clear">مسح</button></div></section></main>
<div id="win" class="win"><div class="winbox"><div class="emoji">🎉</div><h2>أحسنت!</h2><p id="wintext"></p><button class="big" id="next">المرحلة التالية</button><button class="big secondary" id="winback">العودة للمراحل</button></div></div>
<script>
const stages=[
{title:'البداية',words:[['قط','حيوان أليف صغير'],['شمس','نجم نراه نهاراً'],['بحر','مسطح مائي واسع'],['قمر','جسم نراه ليلاً'],['فيل','حيوان ضخم له خرطوم'],['نحلة','حشرة تنتج العسل']]},
{title:'سهل',words:[['دولفين','ثديي يعيش في البحر'],['نمر','حيوان مفترس مخطط'],['مطر','ماء ينزل من السحب'],['نسر','طائر جارح قوي'],['هرم','بناء هندسي شهير'],['مفتاح','أداة تفتح القفل']]},
{title:'متوسط',words:[['مجرة','تجمع هائل من النجوم'],['بوصلة','أداة تحدد الاتجاهات'],['بركان','جبل قد يقذف الحمم'],['مومياء','جثمان حُفظ بطريقة خاصة'],['زرافة','حيوان طويل الرقبة'],['كهرباء','طاقة مرتبطة بالشحنات']]},
{title:'متوسط+',words:[['ديناصور','حيوان عاش في عصور قديمة'],['محيط','مسطح مائي هائل يحيط بالقارات'],['صاعقة','تفريغ كهربائي قوي يصل إلى الأرض'],['حضارة','مجتمع متقدم له نظم وثقافة'],['جاذبية','قوة تجذب الأجسام نحو بعضها'],['مغناطيس','جسم يجذب بعض المعادن']]},
{title:'صعب',words:[['البناءالضوئي','عملية تصنع بها النباتات غذاءها من الضوء'],['استوائية','منطقة قريبة من خط الاستواء'],['كوكبة','مجموعة نجوم تبدو كأنها شكل معين'],['زئبق','أقرب كوكب إلى الشمس'],['تلسكوب','أداة لرؤية الأجرام البعيدة'],['احتباس','ظاهرة ارتفاع حرارة الغلاف الجوي']]},
{title:'صعب جداً',words:[['كروموسوم','بنية تحمل المادة الوراثية داخل الخلية'],['ميكروسكوب','أداة تكبر الأجسام الدقيقة'],['ديناميكا','فرع من الميكانيكا يدرس الحركة والقوى'],['فسيولوجيا','علم وظائف أعضاء الكائنات الحية'],['أحفورة','بقايا أو آثار كائنات قديمة محفوظة'],['مجرة','نظام هائل من النجوم والغاز والغبار']]},
{title:'خبير',words:[['أنثروبولوجيا','علم يدرس الإنسان وثقافاته وتطوره'],['جيولوجيا','علم يدرس الأرض وبنيتها وتاريخها'],['كهرومغناطيسية','مجال يدرس العلاقة بين الكهرباء والمغناطيسية'],['ميثولوجيا','دراسة الأساطير ومجموعاتها'],['فلكلور','الموروث الشعبي من حكايات وعادات وفنون'],['بيولوجيا','علم دراسة الكائنات الحية']]},
{title:'التحدي النهائي',words:[['فلسفة','بحث عقلي في قضايا الوجود والمعرفة والقيم'],['فيزياء','علم يدرس المادة والطاقة والقوانين الطبيعية'],['استعمار','سيطرة دولة على أرض أو شعب خارج حدودها'],['ديمقراطية','نظام يقوم على مشاركة الشعب في الحكم'],['معلوماتية','مجال يهتم بمعالجة المعلومات حاسوبياً'],['حضارة','منظومة متكاملة من منجزات مجتمع ما']]}
];
let current=0,activeWord=0,answer='',points=+localStorage.mpoints||0,streak=+localStorage.mstreak||0,done=JSON.parse(localStorage.mdone||'[]'),solved={},layouts={};
const $=id=>document.getElementById(id);function norm(s){return String(s).replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ـ/g,'').replace(/\s/g,'')}
function save(){localStorage.mpoints=points;localStorage.mstreak=streak;localStorage.mdone=JSON.stringify(done);$('points').textContent=points;$('streak').textContent=streak;$('gpoints').textContent=points}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}
function levels(){let h='';stages.forEach((s,i)=>{let locked=i>0&&!done.includes(i-1);h+=`<button class="level ${done.includes(i)?'done':''}" ${locked?'disabled':''} data-i="${i}">${done.includes(i)?'✓':i+1}<small>${s.title}</small></button>`});$('levels').innerHTML=h;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>openStage(+b.dataset.i));save()}
function makeLayout(){
 const words=stages[current].words.map(x=>norm(x[0])),N=25,grid=Array.from({length:N},()=>Array(N).fill('')),placed=[];
 const dirs=[['h',0,1],['v',1,0]];
 function can(w,r,c,d,first){let dr=d==='v'?1:0,dc=d==='h'?1:0;if(r<2||c<2||r+(w.length-1)*dr>N-3||c+(w.length-1)*dc>N-3)return false;let crosses=0;
  for(let k=0;k<w.length;k++){let rr=r+k*dr,cc=c+k*dc,x=grid[rr][cc];if(x&&x!==w[k])return false;if(x===w[k])crosses++;
   let around=d==='h'?[[rr-1,cc],[rr+1,cc]]:[[rr,cc-1],[rr,cc+1]];for(const [ar,ac] of around)if(ar>=0&&ar<N&&ac>=0&&ac<N&&grid[ar][ac]&&grid[ar][ac]!==w[k]&&!x)return false;
  }
  if(!first&&crosses===0)return false;return true}
 function put(w,r,c,d,idx){let dr=d==='v'?1:0,dc=d==='h'?1:0;for(let k=0;k<w.length;k++)grid[r+k*dr][c+k*dc]=w[k];placed.push({idx,w,r,c,d})}
 let order=[...words.keys()].sort((a,b)=>words[b].length-words[a].length),first=order[0],fw=words[first];put(fw,Math.floor(N/2),Math.floor((N-fw.length)/2),'h',first);
 for(let oi=1;oi<order.length;oi++){let idx=order[oi],w=words[idx],best=null;
  for(const p of placed){for(let a=0;a<w.length;a++)for(let b=0;b<p.w.length;b++)if(w[a]===p.w[b]){let d=p.d==='h'?'v':'h',r=p.r+(p.d==='v'?b:0)-(d==='v'?a:0),c=p.c+(p.d==='h'?b:0)-(d==='h'?a:0);if(can(w,r,c,d,false)){best={r,c,d};break}}if(best)break} 
  if(!best){for(let r=2;r<N-2&&!best;r++)for(let c=2;c<N-2&&!best;c++)for(const d of dirs.map(x=>x[0]))if(can(w,r,c,d,false))best={r,c,d}}
  if(best)put(w,best.r,best.c,best.d,idx);
 }
 let minR=N,maxR=0,minC=N,maxC=0;for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]){minR=Math.min(minR,r);maxR=Math.max(maxR,r);minC=Math.min(minC,c);maxC=Math.max(maxC,c)}
 return{grid,placed,minR,maxR,minC,maxC};
}
function getLayout(){if(!layouts[current])layouts[current]=makeLayout();return layouts[current]}
function cellsFor(idx){let p=getLayout().placed.find(x=>x.idx===idx);let a=[];if(!p)return a;for(let k=0;k<p.w.length;k++)a.push([p.r+(p.d==='v'?k:0),p.c+(p.d==='h'?k:0)]);return a}
function render(){let L=getLayout(),h='',cols=L.maxC-L.minC+1;$('grid').style.gridTemplateColumns=`repeat(${cols},var(--cell))`;for(let r=L.minR;r<=L.maxR;r++)for(let c=L.minC;c<=L.maxC;c++){let ch=L.grid[r][c];if(!ch){h+='<div class="void"></div>';continue}let hit=L.placed.filter(p=>cellsFor(p.idx).some(x=>x[0]===r&&x[1]===c));let good=hit.some(p=>solved[p.idx]);let active=hit.some(p=>p.idx===activeWord);let letter='';if(good){let p=hit.find(x=>solved[x.idx]);letter=p.w[cellsFor(p.idx).findIndex(x=>x[0]===r&&x[1]===c)]||''}else if(active){let p=hit.find(x=>x.idx===activeWord),k=cellsFor(activeWord).findIndex(x=>x[0]===r&&x[1]===c);letter=answer[k]||''}h+=`<div class="sq ${active?'active ':''}${good?'good':''}" data-r="${r}" data-c="${c}">${letter}</div>`}$('grid').innerHTML=h;document.querySelectorAll('.sq').forEach(e=>e.onclick=()=>select(+activeWord));}
function clue(){let w=stages[current].words[activeWord];$('clue').innerHTML=`<div class="cluebox"><div class="clueNo">السؤال ${activeWord+1} من ${stages[current].words.length}</div><div class="clue">${w[1]}</div></div>`;$('topic').textContent=stages[current].title}
function select(i){activeWord=i;answer='';$('native').value='';clue();render();setTimeout(()=>$('native').focus(),20)}
function autoCheck(){let target=norm(stages[current].words[activeWord][0]);let a=norm(answer);if(a.length<target.length)return;if(a===target){solved[activeWord]=true;points+=10+current*5;streak++;$('msg').textContent='✓ إجابة صحيحة';save();render();if(Object.keys(solved).length===stages[current].words.length){if(!done.includes(current))done.push(current);save();setTimeout(showWin,500)}else{setTimeout(()=>{let n=stages[current].words.findIndex((_,i)=>!solved[i]);if(n>=0)select(n)},450)}}else{$('msg').textContent='✗ جرّب مرة أخرى';streak=0;save();setTimeout(()=>{$('msg').textContent=''},900)}}
$('native').addEventListener('input',e=>{answer=norm(e.target.value).slice(0,norm(stages[current].words[activeWord][0]).length);e.target.value=answer;render();autoCheck()});
$('clear').onclick=()=>{answer='';$('native').value='';$('msg').textContent='';render();$('native').focus()};
function openStage(i){current=i;activeWord=0;answer='';solved={};$('num').textContent=i+1;$('points').textContent=points;show('game');clue();render();$('native').focus()}
function showWin(){let last=current===stages.length-1;$('wintext').textContent=last?'أنهيت جميع المراحل! مجموعك '+points+' نقطة.':'أنهيت المرحلة '+(current+1)+' بنجاح.';$('next').style.display=last?'none':'block';$('win').classList.add('show');levels()}
$('back').onclick=()=>{show('home');levels()};$('winback').onclick=()=>{$('win').classList.remove('show');show('home');levels()};$('next').onclick=()=>{$('win').classList.remove('show');openStage(current+1)};levels();save();
</script></body></html>
