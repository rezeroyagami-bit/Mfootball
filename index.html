<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>معلوماتي</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#315d78,#07131f 68%);color:#fff;font-family:Tahoma,Arial,sans-serif}.app{max-width:650px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;background:#ffffff14;border:1px solid #ffffff22;border-radius:22px;padding:13px 16px;box-shadow:0 12px 35px #0006;backdrop-filter:blur(14px)}.brand{font-size:21px;font-weight:900}.stats{display:flex;gap:7px}.pill{background:#0005;border-radius:13px;padding:7px 10px;font-weight:900}.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:30px 10px 20px}.hero .logo{font-size:64px;filter:drop-shadow(0 10px 18px #0007)}h1{font-size:38px;margin:4px 0;background:linear-gradient(#fff,#b9d5e7);-webkit-background-clip:text;color:transparent}.hero p{color:#b9cbd8}.stage{font-size:18px;color:#ffd86d;font-weight:900;margin-bottom:14px}.card{background:linear-gradient(145deg,#ffffff16,#ffffff08);border:1px solid #ffffff20;border-radius:26px;padding:18px;box-shadow:0 18px 50px #0006;backdrop-filter:blur(14px)}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.level{aspect-ratio:1;border:1px solid #ffffff20;border-radius:18px;background:#ffffff0d;color:#fff;font-size:21px;font-weight:900}.level.done{background:#176b54}.level:disabled{opacity:.3}.gamehead{display:flex;align-items:center;justify-content:space-between;margin:15px 0}.back{border:0;border-radius:13px;padding:9px 12px;background:#ffffff14;color:#fff}.question{font-size:24px;line-height:1.55;text-align:center;margin:8px 0}.source{text-align:center;color:#ffd86d;font-size:12px;margin:8px}.hint{text-align:center;color:#9eb4c5;font-size:13px}.letters{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:22px 0}.cell{width:45px;height:45px;border-radius:12px;border:2px solid #506b80;background:#081522;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:900}.cell.filled{border-color:#e5b437;color:#ffd86d;background:#1c2630}.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.key{border:0;border-radius:11px;background:#ffffff13;color:#fff;min-height:46px;font-size:18px;font-weight:900}.key:active{transform:scale(.93)}.big{width:100%;border:0;border-radius:16px;padding:16px;margin-top:11px;background:linear-gradient(135deg,#f2c14e,#d89220);color:#18120a;font-size:18px;font-weight:900}.secondary{background:#ffffff13;color:#fff}.msg{text-align:center;min-height:28px;margin:10px;font-weight:900}.win{position:fixed;inset:0;background:#020b13ee;display:none;align-items:center;justify-content:center;padding:22px;z-index:9;backdrop-filter:blur(8px)}.win.show{display:flex}.winbox{width:min(430px,100%);text-align:center;background:linear-gradient(145deg,#18334a,#0b1b2a);border:1px solid #ffffff25;border-radius:28px;padding:26px;box-shadow:0 20px 70px #0008}.emoji{font-size:64px}@media(max-width:390px){.cell{width:39px;height:39px}.key{min-height:42px;font-size:16px}.hero .logo{font-size:56px}h1{font-size:34px}}</style></head><body><main class="app"><div class="top"><div class="brand">🧠 معلوماتي</div><div class="stats"><span class="pill">⭐ <b id="points">0</b></span><span class="pill">🔥 <b id="streak">0</b></span></div></div><section id="home" class="screen active"><div class="hero"><div class="logo">📚</div><h1>معلوماتي</h1><p>المرحلة الأولى من مجلة ناشيونال جيوغرافيك العربية</p></div><div class="card"><div class="stage">🌍 المرحلة الأولى — ناشيونال جيوغرافيك</div><div id="levels" class="levels"></div></div></section><section id="game" class="screen"><div class="gamehead"><button class="back" id="back">← المراحل</button><b>السؤال <span id="num"></span></b><span class="pill">⭐ <span id="gpoints">0</span></span></div><div class="card"><div class="question" id="question"></div><div class="source">مأخوذ من العدد الأول من المجلة</div><div class="hint" id="hint"></div><div id="letters" class="letters"></div><div id="msg" class="msg"></div><div id="keyboard" class="keyboard"></div><button class="big secondary" id="clear">مسح الإجابة</button><button class="big" id="submit">تحقق ✓</button></div></section></main><div id="win" class="win"><div class="winbox"><div class="emoji">🎉</div><h2>إجابة صحيحة!</h2><p id="wintext"></p><button class="big" id="next">السؤال التالي</button><button class="big secondary" id="winback">العودة للمراحل</button></div></div><script>const data=[['ما الحيوان الذي يتناول الخيزران ويظهر في موضوعات الحيوانات؟','حيوان من الثدييات','الباندا'],['ما الحيوان الذي يتناول موضوعه العدد معلومات عن صغاره؟','يظهر في صفحات الحيوانات','الفيل'],['ما اسم التلسكوب الفضائي الذي تناول العدد اكتشافاته؟','مرصد فضائي شهير','هابل'],['ما اسم الكوكب القزم المذكور في موضوع الفضاء؟','ذُكر ضمن موضوع الفضاء','بلوتو'],['ما اسم الملك الفرعوني صاحب القناع الذهبي؟','ملك مصري قديم','توتعنخامون'],['ما اسم الفرعون الذي تناول العدد قصة اكتشاف مقبرته وموميائه؟','ملك من مصر القديمة','توتعنخامون'],['ما التقنية المستخدمة لفحص مومياء توت عنخ آمون؟','فحص طبي يعتمد على الأشعة','الاشعةالسينية'],['ما الحيوان الذي يتناول العدد سؤالاً عن قدرته على تحمّل البرد الشديد؟','زاحف ضخم','التمساح'],['ما اسم الظاهرة التي خصص لها العدد موضوعاً مصوراً بالبرق في السماء؟','تفريغ كهربائي في الجو','البرق'],['ما اسم الظاهرة التي تظهر في السماء على شكل ومضات ضوئية أثناء العواصف؟','مرتبطة بالعواصف الرعدية','البرق'],['ما اسم الخدعة التي تعتمد على تفسير العين للصورة بطريقة غير متوقعة؟','خدعة بصرية','خداعالبصر'],['ما العضو المسؤول عن رؤية الألوان والصور؟','عضو من أعضاء الحس','العين'],['ما اسم الحيوان ذي الرائحة النفاذة الذي ظهر في صفحات الحيوانات؟','حيوان ثديي معروف برائحته','الظربان'],['ما اسم الحيوان الذي يستطيع الالتصاق بالأسطح ويظهر في موضوع الأشياء اللاصقة؟','زاحف صغير','الوزغة'],['ما اسم المادة التي تساعد بعض الحيوانات على الالتصاق بالأسطح؟','تظهر في موضوع الالتصاق','المادةاللاصقة'],['ما اسم المجلة الظاهرة على غلاف العدد؟','مجلة علمية وثقافية','ناشيونالجيوغرافيك'],['ما اسم المدينة المرتبطة بمركز الفضاء في موضوع هابل؟','مركز معروف لرواد الفضاء','مدينةالنجوم'],['ما اسم المجرة التي يظهر موضوعها ضمن صفحات الفضاء والنجوم؟','مجرة نعيش فيها','دربالتبانة'],['ما اسم العلم الذي يدرس الأجرام السماوية والكون؟','مجال دراسة النجوم والكواكب','الفلك'],['ما اسم القمر الصناعي أو التلسكوب الذي ساهم في صور واكتشافات فلكية شهيرة؟','ذُكر في موضوع اكتشافات الفضاء','هابل']];let current=0,answer='',points=+localStorage.mpoints||0,streak=+localStorage.mstreak||0,done=JSON.parse(localStorage.mdone||'[]');const ar='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split(''),$=id=>document.getElementById(id);let ac;function tone(type){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type='sine';o.frequency.value=type==='win'?880:type==='bad'?180:type==='tap'?620:440;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.055,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+(type==='win'?.22:.09));o.start();o.stop(ac.currentTime+(type==='win'?.24:.1))}catch(e){}}function save(){localStorage.mpoints=points;localStorage.mstreak=streak;localStorage.mdone=JSON.stringify(done);$('points').textContent=points;$('streak').textContent=streak}function show(x){document.querySelectorAll('.screen').forEach(e=>e.classList.remove('active'));$(x).classList.add('active')}function levels(){let h='';data.forEach((x,i)=>{let locked=i>0&&!done.includes(i-1);h+=`<button class="level ${done.includes(i)?'done':''}" ${locked?'disabled':''} data-i="${i}">${done.includes(i)?'✓':i+1}</button>`});$('levels').innerHTML=h;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>open(+b.dataset.i))}function norm(s){return s.replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ـ/g,'').replace(/\s/g,'').replace(/[ًٌٍَُِّْ]/g,'')}function open(i){current=i;answer='';$('num').textContent=i+1;$('question').textContent=data[i][0];$('hint').textContent=data[i][1];$('msg').textContent='';$('gpoints').textContent=points;show('game');render();tone('open')}function render(){let word=data[current][2],a=norm(answer);$('letters').innerHTML=[...word].map((_,i)=>`<div class="cell ${a[i]?'filled':''}">${a[i]||''}</div>`).join('');let keys=[...new Set([...norm(word),...ar])].sort(()=>Math.random()-.5);$('keyboard').innerHTML=keys.map(c=>`<button class="key" data-k="${c}">${c}</button>`).join('');document.querySelectorAll('.key').forEach(k=>k.onclick=()=>{if(norm(answer).length<norm(word).length){answer+=k.dataset.k;render();tone('tap')}})}function check(){if(norm(answer)===norm(data[current][2])){if(!done.includes(current)){points+=10;done.push(current)}streak++;save();$('wintext').textContent='الإجابة: '+data[current][2]+' — +10 نقاط';$('win').classList.add('show');tone('win')}else{$('msg').textContent='❌ إجابة غير صحيحة، حاول مرة أخرى';streak=0;save();tone('bad')}}$('submit').onclick=check;$('clear').onclick=()=>{answer='';$('msg').textContent='';render();tone('tap')};$('back').onclick=()=>{levels();show('home')};$('winback').onclick=()=>{$('win').classList.remove('show');levels();show('home')};$('next').onclick=()=>{$('win').classList.remove('show');let n=current+1;if(n<data.length)open(n);else{levels();show('home')}};save();levels();</script></body></html>
