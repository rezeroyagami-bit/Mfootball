<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MFOOTBALL — Realistic 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100b;font-family:Arial,sans-serif;touch-action:none}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#183e2a 0,#07110b 65%);z-index:5;color:#fff;text-align:center}#menu .box{width:min(92vw,560px);padding:28px;border:1px solid #ffffff28;border-radius:24px;background:#07130dcc;backdrop-filter:blur(10px);box-shadow:0 20px 80px #0008}.logo{font-size:42px;font-weight:900;letter-spacing:4px}.sub{opacity:.7;margin:7px 0 24px}.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.team{padding:13px 18px;border:1px solid #ffffff2a;border-radius:14px;background:#ffffff0d;color:white}.team.active{background:#ffffff20;border-color:#fff}.start{margin-top:22px;width:100%;padding:17px;border:0;border-radius:15px;background:linear-gradient(135deg,#19a95b,#08753b);color:#fff;font-size:20px;font-weight:900}.hint{font-size:12px;opacity:.55;margin-top:15px}#hud{display:none;position:absolute;inset:0;z-index:3;color:white;pointer-events:none}.score{position:absolute;top:12px;left:50%;transform:translateX(-50%);padding:9px 18px;border-radius:14px;background:#050908c9;border:1px solid #ffffff24;font-size:18px;font-weight:900;direction:ltr}.clock{font-size:12px;opacity:.7;margin-left:10px}.controls{position:absolute;inset:0}.btn{pointer-events:auto;position:absolute;border:1px solid #ffffff30;background:#08100ccc;color:#fff;border-radius:50%;width:58px;height:58px;font-weight:900;font-size:12px;box-shadow:0 7px 22px #0008}.btn:active{transform:scale(.94);background:#ffffff25}.pass{right:28px;bottom:128px}.shoot{right:90px;bottom:65px;width:68px;height:68px;background:#0c6b3d}.through{right:28px;bottom:65px}.switch{left:28px;bottom:145px}.sprint{left:88px;bottom:78px}.pause{left:28px;top:14px;width:45px;height:45px}.joy{pointer-events:auto;position:absolute;left:28px;bottom:30px;width:105px;height:105px;border-radius:50%;background:#ffffff12;border:1px solid #ffffff25}.stick{position:absolute;width:48px;height:48px;left:28px;top:28px;border-radius:50%;background:#ffffff35;border:1px solid #ffffff44}.msg{position:absolute;top:72px;left:50%;transform:translateX(-50%);font-size:13px;opacity:.8}.rotate{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#06100bee;z-index:10;color:white;text-align:center;font-weight:800}.rotate div{padding:25px}.loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:9;background:#050b08dd;color:#fff;font-size:18px;font-weight:800}
</style>
</head><body>
<div id="app"></div>
<div id="menu"><div class="box"><div class="logo">MFOOTBALL</div><div class="sub">REALISTIC 3D FOOTBALL</div><div class="row"><button class="team active" id="barca">🔵🔴 BARCELONA</button><button class="team" id="madrid">⚪ REAL MADRID</button></div><button class="start" id="start">▶ ابدأ المباراة</button><div class="hint">22 لاعباً • أجسام ثلاثية الأبعاد • جري وتحريك • تمرير وتسديد • أهداف ونتيجة</div></div></div>
<div id="loading">جاري تجهيز الملعب واللاعبين…</div>
<div id="hud"><div class="score"><span id="sc">0 — 0</span><span class="clock" id="clock">00:00</span></div><div class="msg" id="msg"></div><button class="btn pause" id="pause">Ⅱ</button><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="controls"><button class="btn pass" id="pass">PASS</button><button class="btn shoot" id="shoot">SHOOT</button><button class="btn through" id="through">THRU</button><button class="btn switch" id="switch">SWITCH</button><button class="btn sprint" id="sprint">SPRINT</button></div></div>
<div class="rotate"><div>↻<br><br>أدر الهاتف بالعرض للعب</div></div>
<script type="module">
const $=id=>document.getElementById(id);let selected='barca';$('barca').onclick=()=>{selected='barca';$('barca').classList.add('active');$('madrid').classList.remove('active')};$('madrid').onclick=()=>{selected='madrid';$('madrid').classList.add('active');$('barca').classList.remove('active')};
let THREE,GLTFLoader,SkeletonUtils,scene,camera,renderer,clock3,players=[],ball,ballVel=new (class{constructor(){this.x=0;this.z=0}})(),keys={},joyX=0,joyY=0,running=false,paused=false,scoreA=0,scoreB=0,matchStart=0,active;
function landscape(){return innerWidth>innerHeight||innerWidth>700}function orientation(){document.querySelector('.rotate').style.display=landscape()?'none':'flex'}addEventListener('resize',orientation);orientation();
async function loadLib(){if(THREE)return;THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js');GLTFLoader=(await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js')).GLTFLoader;SkeletonUtils=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/utils/SkeletonUtils.js')}
$('start').addEventListener('click',async()=>{if(running)return;$('start').disabled=true;$('loading').style.display='flex';try{await loadLib();init();running=true;$('menu').style.display='none';$('hud').style.display='block';matchStart=performance.now();}catch(e){console.error(e);$('loading').innerHTML='تعذر تحميل اللعبة. أعد فتح الرابط الجديد.';return}finally{$('loading').style.display='none'}});
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x08150e);scene.fog=new THREE.Fog(0x08150e,35,110);camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,300);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('app').appendChild(renderer.domElement);clock3=new THREE.Clock();
let amb=new THREE.HemisphereLight(0xffffff,0x17351f,2.1);scene.add(amb);let sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-25,45,20);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
field();createBall();loadPlayers();window.addEventListener('resize',resize);bindControls();animate()}
function field(){let g=new THREE.PlaneGeometry(105,68),m=new THREE.MeshStandardMaterial({color:0x176b38,roughness:.9});let f=new THREE.Mesh(g,m);f.rotation.x=-Math.PI/2;f.receiveShadow=true;scene.add(f);let lineMat=new THREE.LineBasicMaterial({color:0xffffff});function line(points){let geo=new THREE.BufferGeometry().setFromPoints(points);scene.add(new THREE.Line(geo,lineMat))}const y=.03;line([new THREE.Vector3(-52.5,y,-34),new THREE.Vector3(52.5,y,-34),new THREE.Vector3(52.5,y,34),new THREE.Vector3(-52.5,y,34),new THREE.Vector3(-52.5,y,-34)]);line([new THREE.Vector3(0,y,-34),new THREE.Vector3(0,y,34)]);let c=[];for(let i=0;i<=48;i++){let a=i/48*Math.PI*2;c.push(new THREE.Vector3(Math.cos(a)*9.15,y,Math.sin(a)*9.15))}line(c);box(-52.5,0,0,1,3,24);box(52.5,0,0,1,3,24);goal(-54.5);goal(54.5);for(let i=-4;i<=4;i++){box(i*13,2,-38,11,4,1);box(i*13,2,38,11,4,1)}}function box(x,y,z,w,h,d){let q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:0x0a1710}));q.position.set(x,y,z);q.castShadow=true;scene.add(q)}function goal(x){let mat=new THREE.MeshStandardMaterial({color:0xffffff,metalness:.1});let s=Math.sign(x);let g=new THREE.Group();for(let z of [-11,11]){let p=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,3.4,10),mat);p.position.set(x,1.7,z);g.add(p)}let bar=new THREE.Mesh(new THREE.BoxGeometry(.25,3.4,22),mat);bar.position.set(x,1.7,0);g.add(bar);g.position.x=-s*1.5;scene.add(g)}
function createBall(){ball=new THREE.Mesh(new THREE.SphereGeometry(1.05,24,24),new THREE.MeshStandardMaterial({color:0xf5f5f5,roughness:.45}));ball.position.set(0,1.1,0);ball.castShadow=true;scene.add(ball)}
async function loadPlayers(){let loader=new GLTFLoader();let gltf=await loader.loadAsync('https://threejs.org/examples/models/gltf/Soldier.glb');let base=gltf.scene;let anim=gltf.animations;let formations=[[-45,0],[-35,-14],[-35,14],[-24,-24],[-24,-8],[-24,8],[-24,24],[-8,-25],[-8,-8],[-8,8],[-8,25]];for(let team=0;team<2;team++){for(let i=0;i<11;i++){let model=SkeletonUtils.clone(base);model.scale.setScalar(1.05);let x=team? -formations[i][0]:formations[i][0],z=formations[i][1];model.position.set(x,0,z);model.rotation.y=team?Math.PI:0;model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;let mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(mm=>{mm=mm.clone();mm.color=new THREE.Color(team?'#f3f3f3':'#b51f3a');o.material=Array.isArray(o.material)?o.material.map(()=>mm):mm})}});let mixer=new THREE.AnimationMixer(model);let run=mixer.clipAction(anim.find(a=>a.name.toLowerCase().includes('run'))||anim[1]);run.play();let p={model,mixer,run,team,x,z,homeX:x,homeZ:z,speed:team?6.2:6.5};scene.add(model);players.push(p)}}active=players.find(p=>p.team===(selected==='barca'?0:1))||players[0]}
function bindControls(){document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);let joy=$('joy'),stick=$('stick'),drag=false;function move(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,px=(e.touches?e.touches[0].clientX:e.clientX)-cx,py=(e.touches?e.touches[0].clientY:e.clientY)-cy,d=Math.hypot(px,py),max=42;if(d>max){px*=max/d;py*=max/d}joyX=px/max;joyY=py/max;stick.style.transform=`translate(${px}px,${py}px)`}joy.addEventListener('pointerdown',e=>{drag=true;joy.setPointerCapture(e.pointerId);move(e)});joy.addEventListener('pointermove',e=>drag&&move(e));joy.addEventListener('pointerup',()=>{drag=false;joyX=joyY=0;stick.style.transform='translate(0,0)'});$('pass').onclick=()=>kick(15);$('through').onclick=()=>kick(24);$('shoot').onclick=()=>kick(42,true);$('switch').onclick=()=>switchPlayer();$('sprint').onpointerdown=()=>keys.shift=true;$('sprint').onpointerup=()=>keys.shift=false;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'}}
function kick(power,shot=false){if(!active)return;let dx=ball.position.x-active.model.position.x,dz=ball.position.z-active.model.position.z;if(Math.hypot(dx,dz)>5)return;let l=Math.hypot(dx,dz)||1;let dir=new THREE.Vector3(dx/l,0,dz/l);if(shot){dir.z*=.55}ballVel.x=dir.x*power;ballVel.z=dir.z*power;ball.position.y=1.1;msg(shot?'تسديدة!':'تمريرة')}
function switchPlayer(){let mine=players.filter(p=>p.team===(selected==='barca'?0:1));let idx=Math.max(0,mine.indexOf(active));active=mine[(idx+1)%mine.length];msg('تغيير اللاعب')}
function msg(t){$('msg').textContent=t;setTimeout(()=>{if($('msg').textContent===t)$('msg').textContent=''},900)}
function update(dt){let userTeam=selected==='barca'?0:1;players.forEach(p=>{p.mixer.update(dt);let targetX=p.homeX,targetZ=p.homeZ;if(p===active){let ix=joyX+(keys.d?1:0)-(keys.a?1:0),iz=joyY+(keys.s?1:0)-(keys.w?1:0),len=Math.hypot(ix,iz);if(len>.05){ix/=len;iz/=len;let sp=(keys.shift?10:7)*dt;p.model.position.x+=ix*sp;p.model.position.z+=iz*sp;p.model.rotation.y=Math.atan2(ix,iz);p.x=p.model.position.x;p.z=p.model.position.z}}else{let towardBall=(p.team===userTeam?0.12:0.22);targetX=p.homeX+(ball.position.x-p.homeX)*towardBall;targetZ=p.homeZ+(ball.position.z-p.homeZ)*towardBall;let dx=targetX-p.model.position.x,dz=targetZ-p.model.position.z,d=Math.hypot(dx,dz);if(d>.2){let sp=p.speed*dt;p.model.position.x+=dx/d*Math.min(sp,d);p.model.position.z+=dz/d*Math.min(sp,d);p.model.rotation.y=Math.atan2(dx,dz)}}p.model.position.x=Math.max(-51,Math.min(51,p.model.position.x));p.model.position.z=Math.max(-33,Math.min(33,p.model.position.z))});let ap=active.model.position,dx=ball.position.x-ap.x,dz=ball.position.z-ap.z;if(Math.hypot(dx,dz)<2.3&&Math.abs(ballVel.x)+Math.abs(ballVel.z)<1.5){ball.position.x=ap.x;ball.position.z=ap.z+1.4}
ballVel.x*=Math.pow(.985,dt*60);ballVel.z*=Math.pow(.985,dt*60);ball.position.x+=ballVel.x*dt;ball.position.z+=ballVel.z*dt;ball.position.y=1.1+Math.abs(Math.sin(performance.now()/90))*0.08;if(Math.abs(ball.position.x)>52){if(Math.abs(ball.position.z)<11){if(ball.position.x>0)scoreA++;else scoreB++;$('sc').textContent=`${scoreA} — ${scoreB}`;msg('GOOOAL!');ball.position.set(0,1.1,0);ballVel.x=ballVel.z=0}else{ballVel.x*=-.7;ball.position.x=Math.sign(ball.position.x)*51.5}}if(Math.abs(ball.position.z)>34){ballVel.z*=-.7;ball.position.z=Math.sign(ball.position.z)*33}
let camTarget=new THREE.Vector3(ap.x,0,ap.z);let desired=new THREE.Vector3(ap.x,32,ap.z+27);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(camTarget);$('clock').textContent=formatTime((performance.now()-matchStart)/1000)}function formatTime(s){s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function animate(){requestAnimationFrame(animate);if(!running)return;let dt=Math.min(clock3.getDelta(),.033);if(!paused)update(dt);renderer.render(scene,camera)}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);orientation()}
</script></body></html>
