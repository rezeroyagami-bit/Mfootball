<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MFOOTBALL 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font-family:Arial;color:#fff;touch-action:none}#c{position:fixed;inset:0;width:100%;height:100%}.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06101ddd,#102b42dd)}.panel{width:min(720px,94vw);padding:22px;border-radius:22px;background:#09131ff5;text-align:center;border:1px solid #ffffff30}.teams{display:flex;align-items:center;justify-content:center;gap:15px}.team{width:180px;padding:12px;border:2px solid #ffffff20;border-radius:18px}.team.active{border-color:#ffd21c}.team img{width:65px;height:65px;object-fit:contain}.team b{display:block}.start{width:100%;margin-top:18px;padding:15px;border:0;border-radius:16px;background:#ffd21c;color:#111;font-size:20px;font-weight:900}.hidden{display:none!important}.hud{position:fixed;z-index:5;inset:0;pointer-events:none}.score{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#071018dd;padding:8px 16px;border-radius:14px;font-weight:900}.clock{position:absolute;top:12px;right:15px;background:#071018dd;padding:8px;border-radius:12px}.pause{pointer-events:auto;position:absolute;top:55px;right:15px;width:42px;height:42px;border:0;border-radius:50%;background:#111c;color:#fff}.controls{position:fixed;z-index:6;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:20px;bottom:20px;width:105px;height:105px;border:2px solid #ffffff40;border-radius:50%;background:#ffffff10}.knob{position:absolute;left:31px;top:31px;width:40px;height:40px;border-radius:50%;background:#ffffff55}.buttons{position:absolute;right:20px;bottom:18px;width:190px;height:155px}.b{pointer-events:auto;position:absolute;width:48px;height:48px;border:2px solid #ffffff45;border-radius:50%;background:#18202add;color:#fff;font-size:10px;font-weight:bold}.shoot{right:0;bottom:48px;width:58px;height:58px;background:#d89b00}.pass{right:65px;bottom:90px}.through{right:120px;bottom:48px}.run{right:58px;bottom:4px;background:#16864b}.switch{right:125px;bottom:105px}.tackle{right:0;bottom:0}@media(orientation:portrait){body:after{content:'↻  أدر الهاتف إلى الوضع الأفقي';position:fixed;inset:0;z-index:99;background:#071018;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}.menu,.hud,.controls{display:none!important}}</style></head><body><canvas id="c"></canvas><div id="menu" class="menu"><div class="panel"><h1>MFOOTBALL 3D</h1><div class="teams"><div id="barca" class="team active"><img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg"><b>FC BARCELONA</b></div><b>VS</b><div id="madrid" class="team"><img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg"><b>REAL MADRID</b></div></div><button id="start" class="start">ابدأ المباراة</button></div></div><div id="hud" class="hud hidden"><div id="score" class="score">برشلونة 0 — 0 ريال مدريد</div><div id="clock" class="clock">05:00</div><button id="pause" class="pause">Ⅱ</button></div><div id="controls" class="controls hidden"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="buttons"><button id="shoot" class="b shoot">تسديد</button><button id="pass" class="b pass">تمريرة</button><button id="through" class="b through">بينية</button><button id="run" class="b run">جري</button><button id="switch" class="b switch">تبديل</button><button id="tackle" class="b tackle">افتكاك</button></div></div><script>const $=id=>document.getElementById(id);let team='barca';$('barca').onclick=()=>{team='barca';$('barca').classList.add('active');$('madrid').classList.remove('active')};$('madrid').onclick=()=>{team='madrid';$('madrid').classList.add('active');$('barca').classList.remove('active')};$('start').addEventListener('click',function(){this.disabled=true;this.textContent='جاري تحميل المباراة...';startGame()});function startGame(){if(window.THREE){initGame();return}let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';s.onload=initGame;s.onerror=()=>{alert('تعذر تحميل محرك 3D. أعد فتح الصفحة مع الإنترنت.');$('start').disabled=false;$('start').textContent='ابدأ المباراة'};document.head.appendChild(s)}function initGame(){if(window.gameStarted)return;window.gameStarted=true;$('menu').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden');const scene=new THREE.Scene();scene.background=new THREE.Color(0x87a8bb);scene.fog=new THREE.Fog(0x87a8bb,45,120);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,200);const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;scene.add(new THREE.HemisphereLight(0xffffff,0x21452b,1.8));let light=new THREE.DirectionalLight(0xffffff,2);light.position.set(10,30,10);light.castShadow=true;scene.add(light);let field=new THREE.Mesh(new THREE.BoxGeometry(70,.2,44),new THREE.MeshStandardMaterial({color:0x148348}));field.receiveShadow=true;scene.add(field);let lineMat=new THREE.MeshBasicMaterial({color:0xffffff});function addLine(g,x,z){let m=new THREE.Mesh(g,lineMat);m.position.set(x,.13,z);scene.add(m)}addLine(new THREE.BoxGeometry(70,.04,.12),0,-22);addLine(new THREE.BoxGeometry(70,.04,.12),0,22);addLine(new THREE.BoxGeometry(.12,.04,44),0,0);addLine(new THREE.BoxGeometry(.12,.04,44),-35,0);addLine(new THREE.BoxGeometry(.12,.04,44),35,0);let circle=new THREE.Mesh(new THREE.RingGeometry(6,6.08,64),lineMat);circle.rotation.x=-Math.PI/2;circle.position.y=.15;scene.add(circle);function goal(x){let g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0xffffff});for(let z of[-4.5,4.5]){let p=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,3,10),m);p.position.set(x,1.5,z);g.add(p)}let b=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,9,10),m);b.rotation.x=Math.PI/2;b.position.set(x,3,0);g.add(b);scene.add(g)}goal(-35);goal(35);let players=[];function player(t,x,z){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1,6,12),new THREE.MeshStandardMaterial({color:t==='barca'?0x17469c:0xf2f2f2}));body.position.y=.8;body.castShadow=true;g.add(body);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,12,12),new THREE.MeshStandardMaterial({color:0xc98d6a}));head.position.y=1.8;g.add(head);g.position.set(x,.1,z);g.userData={team:t,homeX:x,homeZ:z};scene.add(g);players.push(g);return g}let formation=[[27,0],[20,-15],[20,-5],[20,5],[20,15],[8,-12],[7,0],[8,12],[-10,-14],[-12,0],[-10,14]];formation.forEach(p=>player(team,p[0],p[1]));formation.forEach(p=>player(team==='barca'?'madrid':'barca',-p[0],p[1]));let controlled=0,p=players[0];let ball=new THREE.Mesh(new THREE.SphereGeometry(.42,18,18),new THREE.MeshStandardMaterial({color:0xffffff}));ball.position.set(p.position.x+1,.45,p.position.z);ball.castShadow=true;scene.add(ball);let joy={x:0,z:0},sprint=false,paused=false,time=300,vx=0,vz=0,owner=0;function kick(power){owner=null;let x=joy.x||(team==='barca'?1:-1),z=joy.z,len=Math.hypot(x,z)||1;vx=x/len*power;vz=z/len*power}$('shoot').onclick=()=>kick(28);$('pass').onclick=()=>kick(11);$('through').onclick=()=>kick(18);$('switch').onclick=()=>{controlled=(controlled+1)%11;p=players[controlled]};$('run').onpointerdown=()=>sprint=true;$('run').onpointerup=()=>sprint=false;$('pause').onclick=()=>paused=!paused;let joyEl=$('joy'),knob=$('knob');joyEl.onpointerdown=e=>joyEl.setPointerCapture(e.pointerId);joyEl.onpointermove=e=>{let r=joyEl.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),z=(e.clientY-r.top-r.height/2)/(r.height/2),m=Math.hypot(x,z)||1;if(m>1){x/=m;z/=m}joy={x,z};knob.style.transform=`translate(${x*25}px,${z*25}px)`};joyEl.onpointerup=joyEl.onpointercancel=()=>{joy={x:0,z:0};knob.style.transform=''};let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min(.033,(now-last)/1000);last=now;if(!paused){let speed=sprint?12:7;p.position.x=Math.max(-31,Math.min(31,p.position.x+joy.x*speed*dt));p.position.z=Math.max(-19,Math.min(19,p.position.z+joy.z*speed*dt));if(Math.hypot(ball.position.x-p.position.x,ball.position.z-p.position.z)<2)owner=controlled;if(owner===controlled){ball.position.set(p.position.x+(team==='barca'?1:-1),.45,p.position.z)}else{ball.position.x+=vx*dt;ball.position.z+=vz*dt;vx*=.985;vz*=.985}players.forEach((q,i)=>{if(q===p)return;q.position.x+=(q.userData.homeX-q.position.x)*dt*.7;q.position.z+=(q.userData.homeZ-q.position.z)*dt*.7});time-=dt;if(time<=0){time=300;$('menu').classList.remove('hidden');$('hud').classList.add('hidden');$('controls').classList.add('hidden');window.gameStarted=false;$('start').disabled=false;$('start').textContent='ابدأ المباراة';return}}camera.position.lerp(new THREE.Vector3(p.position.x*.35,28,p.position.z+27),.08);camera.lookAt(p.position.x,0,p.position.z);$('clock').textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.floor(time%60)).padStart(2,'0');renderer.render(scene,camera)}requestAnimationFrame(loop)}loop(performance.now());addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}</script></body></html>
