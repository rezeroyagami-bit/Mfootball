<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>MFOOTBALL 3D</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;font-family:Arial;color:#fff;touch-action:none}#c{position:fixed;inset:0}.menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#06101eee,#203d50ee)}.panel{width:min(760px,94vw);padding:22px;border-radius:24px;background:#09131ff5;text-align:center;border:1px solid #ffffff25}.teams{display:flex;justify-content:center;align-items:center;gap:14px}.team{width:180px;padding:12px;border:2px solid #ffffff18;border-radius:18px;cursor:pointer}.team.active{border-color:#ffd21c}.team img{width:65px;height:65px;object-fit:contain}.team b{display:block}.start{width:100%;margin-top:20px;padding:15px;border:0;border-radius:15px;background:#ffd21c;color:#111;font-size:20px;font-weight:900}.hidden{display:none!important}.hud{position:fixed;z-index:10;inset:0;pointer-events:none}.score{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#071018dd;padding:8px 16px;border-radius:13px;font-weight:900}.clock{position:absolute;top:12px;right:15px;background:#071018dd;padding:7px 10px;border-radius:10px}.pause{pointer-events:auto;position:absolute;top:55px;right:15px;width:42px;height:42px;border:0;border-radius:50%;background:#071018dd;color:#fff;font-weight:900}.controls{position:fixed;z-index:12;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:20px;bottom:18px;width:105px;height:105px;border:2px solid #ffffff45;border-radius:50%;background:#ffffff12}.knob{position:absolute;left:31px;top:31px;width:40px;height:40px;border-radius:50%;background:#ffffff55}.buttons{position:absolute;right:18px;bottom:18px;width:190px;height:160px}.b{pointer-events:auto;position:absolute;width:50px;height:50px;border:2px solid #ffffff45;border-radius:50%;background:#111d;color:#fff;font-size:10px;font-weight:900}.b:active{transform:scale(.9)}.shoot{right:0;top:42px;width:62px;height:62px;background:#d69a00}.pass{right:66px;top:5px}.through{right:125px;top:48px}.run{right:60px;bottom:0;background:#18854c}.switch{right:125px;bottom:0}.rotate{display:none}@media(orientation:portrait){.menu{display:none!important}.rotate{display:flex;position:fixed;z-index:99;inset:0;background:#071018;align-items:center;justify-content:center;font-size:21px;font-weight:900;text-align:center}}
</style></head><body><canvas id="c"></canvas><div id="rotate" class="rotate">↻<br>أدر الهاتف إلى الوضع الأفقي</div><div id="menu" class="menu"><div class="panel"><h1>MFOOTBALL 3D</h1><div class="teams"><div id="barca" class="team active"><img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg"><b>FC BARCELONA</b></div><b>VS</b><div id="madrid" class="team"><img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg"><b>REAL MADRID</b></div></div><button id="start" class="start">ابدأ المباراة</button></div></div><div id="hud" class="hud hidden"><div id="score" class="score">برشلونة 0 — 0 ريال مدريد</div><div id="clock" class="clock">05:00</div><button id="pause" class="pause">Ⅱ</button></div><div id="controls" class="controls hidden"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="buttons"><button id="shoot" class="b shoot">تسديد</button><button id="pass" class="b pass">تمريرة</button><button id="through" class="b through">بينية</button><button id="run" class="b run">جري</button><button id="switch" class="b switch">تبديل</button></div></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const $=id=>document.getElementById(id);let chosen='barca',started=false,paused=false,controlled=0,sprint=false,joy={x:0,z:0},ball,players=[],score=[0,0],time=300;const scene=new THREE.Scene();scene.background=new THREE.Color(0x7da0b2);scene.fog=new THREE.Fog(0x7da0b2,55,130);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,220);const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;scene.add(new THREE.HemisphereLight(0xffffff,0x183a25,1.8));let sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(20,35,10);sun.castShadow=true;scene.add(sun);const field=new THREE.Mesh(new THREE.BoxGeometry(76,.3,48),new THREE.MeshStandardMaterial({color:0x168447,roughness:.9}));field.receiveShadow=true;scene.add(field);function line(g,x,z){let m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(x,.17,z);scene.add(m)}line(new THREE.BoxGeometry(76,.04,.12),0,-24);line(new THREE.BoxGeometry(76,.04,.12),0,24);line(new THREE.BoxGeometry(.12,.04,48),0,0);line(new THREE.BoxGeometry(.12,.04,48),-38,0);line(new THREE.BoxGeometry(.12,.04,48),38,0);let cc=new THREE.Mesh(new THREE.RingGeometry(6,6.12,64),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));cc.rotation.x=-Math.PI/2;cc.position.y=.18;scene.add(cc);function goal(x){let g=new THREE.Group(),m=new THREE.MeshStandardMaterial({color:0xffffff});for(let z of[-4.5,4.5]){let p=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,3.2,10),m);p.position.set(x,1.6,z);g.add(p)}let b=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,9,10),m);b.rotation.x=Math.PI/2;b.position.set(x,3.2,0);g.add(b);scene.add(g)}goal(-38);goal(38);function humanoid(team,i){let g=new THREE.Group();let kit=team==='barca'?0x17469c:0xf2f2f2,shorts=team==='barca'?0x101c55:0xeeeeee,skin=0xc98d6a;let torso=new THREE.Mesh(new THREE.BoxGeometry(.9,1.15,.48),new THREE.MeshStandardMaterial({color:kit}));torso.position.y=1.35;torso.castShadow=true;g.add(torso);let head=new THREE.Mesh(new THREE.SphereGeometry(.34,14,12),new THREE.MeshStandardMaterial({color:skin}));head.position.y=2.15;head.castShadow=true;g.add(head);let hip=new THREE.Mesh(new THREE.BoxGeometry(.78,.35,.44),new THREE.MeshStandardMaterial({color:shorts}));hip.position.y=.72;g.add(hip);function limb(x,col){let q=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.72,5,8),new THREE.MeshStandardMaterial({color:col}));q.position.set(x,1.0,0);q.castShadow=true;g.add(q);return q}let armL=limb(-.62,kit),armR=limb(.62,kit);armL.rotation.z=-.12;armR.rotation.z=.12;let legL=limb(-.24,skin),legR=limb(.24,skin);legL.position.y=.32;legR.position.y=.32;legL.scale.y=1.05;legR.scale.y=1.05;g.userData={team,armL,armR,legL,legR,phase:i*.55,baseX:0,baseZ:0};scene.add(g);players.push(g);return g}function reset(){players.forEach(p=>scene.remove(p));players=[];let form=[[30,0],[25,-15],[25,-5],[25,5],[25,15],[8,-12],[8,0],[8,12],[-12,-13],[-15,0],[-12,13]];for(let t=0;t<2;t++)for(let i=0;i<11;i++){let f=form[i],dir=t===0?1:-1,p=humanoid(t===0?chosen:(chosen==='barca'?'madrid':'barca'),i);p.position.set(f[0]*dir,.15,f[1]);p.userData.baseX=p.position.x;p.userData.baseZ=p.position.z}ball.position.set(chosen==='barca'?2:-2,.45,0);ball.userData={owner:0,vx:0,vz:0};controlled=0;score=[0,0];time=300;updateScore()}function updateScore(){$('score').textContent=(chosen==='barca'?'برشلونة':'ريال مدريد')+' '+score[0]+' — '+score[1]+' '+(chosen==='barca'?'ريال مدريد':'برشلونة')}function start(){if(started)return;started=true;paused=false;reset();$('menu').classList.add('hidden');$('hud').classList.remove('hidden');$('controls').classList.remove('hidden')}function kick(power){let p=players[controlled];if(!p)return;ball.userData.owner=null;let dx=joy.x||(chosen==='barca'?1:-1),dz=joy.z,l=Math.hypot(dx,dz)||1;ball.position.set(p.position.x+(chosen==='barca'?1.1:-1.1),.45,p.position.z);ball.userData.vx=dx/l*power;ball.userData.vz=dz/l*power}function animatePlayer(p,dt,moving){let u=p.userData;u.phase+=dt*(moving?11:3);let a=moving?Math.sin(u.phase)*.72:0;u.legL.rotation.z=a;u.legR.rotation.z=-a;u.armL.rotation.z=-a*.7;u.armR.rotation.z=a*.7;p.rotation.y=moving?Math.atan2(joy.x,joy.z):p.rotation.y}$('barca').onclick=()=>{chosen='barca';$('barca').classList.add('active');$('madrid').classList.remove('active')};$('madrid').onclick=()=>{chosen='madrid';$('madrid').classList.add('active');$('barca').classList.remove('active')};$('start').addEventListener('click',start);$('pause').addEventListener('click',()=>paused=!paused);$('shoot').addEventListener('click',()=>kick(25));$('pass').addEventListener('click',()=>kick(12));$('through').addEventListener('click',()=>kick(18));$('switch').addEventListener('click',()=>{controlled=(controlled+1)%11});$('run').addEventListener('pointerdown',()=>sprint=true);['pointerup','pointercancel','pointerleave'].forEach(e=>$('run').addEventListener(e,()=>sprint=false));let j=$('joy'),k=$('knob');j.addEventListener('pointerdown',e=>j.setPointerCapture(e.pointerId));j.addEventListener('pointermove',e=>{let r=j.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),z=(e.clientY-r.top-r.height/2)/(r.height/2),m=Math.hypot(x,z)||1;if(m>1){x/=m;z/=m}joy={x,z};k.style.transform='translate('+x*25+'px,'+z*25+'px)'});j.addEventListener('pointerup',()=>{joy={x:0,z:0};k.style.transform=''});j.addEventListener('pointercancel',()=>{joy={x:0,z:0};k.style.transform=''});function loop(now){requestAnimationFrame(loop);let dt=Math.min(.033,(now-(loop.last||now))/1000);loop.last=now;if(started&&!paused){time-=dt;if(time<=0){started=false;$('menu').classList.remove('hidden');$('hud').classList.add('hidden');$('controls').classList.add('hidden')}let p=players[controlled];if(p){let speed=(sprint?12:7);p.position.x=Math.max(-34,Math.min(34,p.position.x+joy.x*speed*dt));p.position.z=Math.max(-20,Math.min(20,p.position.z+joy.z*speed*dt));let d=Math.hypot(ball.position.x-p.position.x,ball.position.z-p.position.z);if(d<2.1)ball.userData.owner=0;animatePlayer(p,dt,Math.hypot(joy.x,joy.z)>.05)}for(let i=11;i<22;i++){let q=players[i],targetX=ball.userData.owner===null?ball.position.x:q.userData.baseX,targetZ=ball.userData.owner===null?ball.position.z:q.userData.baseZ;let dx=targetX-q.position.x,dz=targetZ-q.position.z,len=Math.hypot(dx,dz);if(len>.4){let s=3.5;q.position.x+=dx/len*s*dt;q.position.z+=dz/len*s*dt;animatePlayer(q,dt,true)}else animatePlayer(q,dt,false)}for(let i=1;i<11;i++){let q=players[i],dx=q.userData.baseX-q.position.x,dz=q.userData.baseZ-q.position.z;q.position.x+=dx*.35*dt;q.position.z+=dz*.35*dt;animatePlayer(q,dt,Math.hypot(dx,dz)>.2)}if(ball.userData.owner===0){ball.position.set(p.position.x+(chosen==='barca'?1.15:-1.15),.45,p.position.z)}else{ball.position.x+=ball.userData.vx*dt;ball.position.z+=ball.userData.vz*dt;ball.userData.vx*=.985;ball.userData.vz*=.985;if(ball.position.z>23||ball.position.z<-23)ball.userData.vz*=-.7;if(ball.position.x>39){score[0]++;updateScore();ball.position.set(0,.45,0);ball.userData.owner=null}if(ball.position.x<-39){score[1]++;updateScore();ball.position.set(0,.45,0);ball.userData.owner=null}}}let p=players[controlled];if(p){camera.position.lerp(new THREE.Vector3(p.position.x*.35,25,p.position.z+25),.08);camera.lookAt(p.position.x,0,p.position.z)}$('clock').textContent=String(Math.max(0,Math.floor(time/60))).padStart(2,'0')+':'+String(Math.max(0,Math.floor(time%60))).padStart(2,'0');renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})</script></body></html>
