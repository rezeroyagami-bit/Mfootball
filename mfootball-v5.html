<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>MFOOTBALL — EL CLÁSICO</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#fff;font-family:Arial,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.portrait{display:none;position:fixed;inset:0;background:#071018;z-index:20;align-items:center;justify-content:center;text-align:center;padding:30px}.portrait div{font-size:22px;font-weight:900}.portrait span{display:block;font-size:50px;margin-bottom:15px}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:0;left:0;right:0;height:62px;background:linear-gradient(#071018e8,#07101888,transparent);display:flex;align-items:center;justify-content:center;gap:18px}.score{font-size:21px;font-weight:900;text-shadow:0 2px 8px #000}.clock{font-size:16px;font-weight:800;background:#071018bb;padding:7px 11px;border-radius:10px}.badge{position:absolute;top:9px;width:44px;height:44px;object-fit:contain}.homeBadge{right:15px}.awayBadge{left:15px}.menu{position:fixed;inset:0;background:radial-gradient(circle at 50% 15%,#243c55,#071018 70%);z-index:10;display:flex;align-items:center;justify-content:center;padding:12px}.panel{width:min(1050px,94vw);max-height:94vh;overflow:auto;background:#09131fe8;border:1px solid #ffffff24;border-radius:22px;padding:18px;box-shadow:0 25px 90px #000b;backdrop-filter:blur(15px)}.title{text-align:center;font-size:30px;font-weight:1000;letter-spacing:2px;margin:0}.sub{text-align:center;color:#aab8c7;margin:4px 0 15px}.teams{display:flex;align-items:center;justify-content:center;gap:18px}.team{width:210px;text-align:center;padding:12px;border:2px solid #ffffff1c;border-radius:18px;background:#ffffff08;cursor:pointer}.team.active{border-color:#ffd21c;box-shadow:0 0 30px #ffd21c20}.team img{width:72px;height:72px;object-fit:contain}.team b{display:block;margin-top:5px}.vs{font-size:28px}.tabs{display:flex;gap:8px;margin:14px 0}.tab{flex:1;border:0;border-radius:10px;padding:10px;background:#ffffff10;color:#fff;font-weight:900}.tab.active{background:#1769e8}.section{display:none}.section.active{display:block}.roster{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.card{display:flex;align-items:center;gap:7px;background:#ffffff08;border:1px solid #ffffff12;border-radius:11px;padding:6px;min-width:0}.card img{width:42px;height:42px;border-radius:8px;object-fit:cover;background:#26313c}.card .n{font-size:10px;color:#91a0b1}.card .p{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.start{display:block;width:100%;margin-top:14px;border:0;border-radius:14px;padding:15px;background:#ffd21c;color:#111;font-size:20px;font-weight:1000}.hint{text-align:center;color:#aab8c7;font-size:12px;margin-top:7px}.controls{position:fixed;inset:0;pointer-events:none}.joy{pointer-events:auto;position:absolute;left:20px;bottom:22px;width:125px;height:125px;border-radius:50%;background:#ffffff12;border:2px solid #ffffff38;box-shadow:inset 0 0 0 22px #ffffff06}.knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px;border-radius:50%;background:#ffffff45;border:1px solid #ffffff55}.buttons{position:absolute;right:18px;bottom:18px;display:grid;grid-template-columns:repeat(3,70px);gap:8px}.btn{pointer-events:auto;border:0;border-radius:16px;height:58px;background:#eef2f6;color:#111;font-weight:1000;box-shadow:0 5px 14px #0007}.btn:active{transform:scale(.94)}.shoot{background:#ffd21c}.run{background:#43d17a}.pause{position:absolute;right:18px;top:75px;width:45px;height:40px;border:0;border-radius:10px;background:#071018cc;color:#fff;font-size:18px;pointer-events:auto}.hidden{display:none!important}@media(max-width:850px){.roster{grid-template-columns:repeat(4,1fr)}.team{width:170px}.buttons{grid-template-columns:repeat(3,62px)}.btn{height:52px}.joy{width:108px;height:108px}}@media(max-width:600px){.roster{grid-template-columns:repeat(3,1fr)}.panel{padding:12px}.title{font-size:23px}.team{width:135px}.team img{width:55px;height:55px}.top{height:52px}.score{font-size:16px}.badge{width:38px;height:38px;top:7px}.homeBadge{right:8px}.awayBadge{left:8px}}</style></head><body><canvas id="game"></canvas><div class="portrait"><div><span>↻</span>أدر الهاتف إلى الوضع الأفقي<br><small>لتجربة MFOOTBALL بالشاشة الكاملة</small></div></div><div id="menu" class="menu"><div class="panel"><h1 class="title">MFOOTBALL</h1><div class="sub">EL CLÁSICO • MATCHDAY</div><div class="teams"><div id="barca" class="team active"><img src="https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg"><b>FC BARCELONA</b></div><div class="vs">VS</div><div id="madrid" class="team"><img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg"><b>REAL MADRID</b></div></div><div class="tabs"><button class="tab active" data-tab="players">قائمة اللاعبين</button><button class="tab" data-tab="match">المباراة</button></div><div id="players" class="section active"><div id="roster" class="roster"></div></div><div id="match" class="section"><div class="hint">ملعب سانتياغو برنابيو • 5 دقائق • تحكم كامل باللاعب والكرة</div></div><button id="start" class="start">ابدأ المباراة</button><div class="hint">الحركة بالعصا • تمريرة • بينية • تسديد • جري • تبديل</div></div></div><div class="hud hidden" id="hud"><div class="top"><img id="homeBadge" class="badge homeBadge"><div id="score" class="score">برشلونة 0 — 0 ريال مدريد</div><div id="clock" class="clock">05:00</div><img id="awayBadge" class="badge awayBadge"></div><button id="pause" class="pause">Ⅱ</button></div><div id="controls" class="controls hidden"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="buttons"><button id="switch" class="btn">تبديل</button><button id="pass" class="btn">تمريرة</button><button id="through" class="btn">بينية</button><button id="run" class="btn run">جري</button><button id="shoot" class="btn shoot">تسديد</button><button id="tackle" class="btn">افتكاك</button></div></div><script>const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const crest={barca:'https://upload.wikimedia.org/wikipedia/en/4/47/FC_Barcelona_%28crest%29.svg',madrid:'https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg'};const squads={barca:[['1','Joan García'],['2','João Cancelo'],['3','Alejandro Balde'],['5','Pau Cubarsí'],['15','Christensen'],['6','Gavi'],['8','Pedri'],['21','Frenkie de Jong'],['10','Lamine Yamal'],['11','Raphinha'],['9','Gabriel Jesus']],madrid:[['1','Courtois'],['24','Dumfries'],['16','Konaté'],['4','Huijsen'],['18','Carreras'],['8','Valverde'],['5','Bellingham'],['15','Arda Güler'],['7','Vini Jr.'],['10','Mbappé'],['11','Rodrygo']]};const pics={'Lamine Yamal':'https://commons.wikimedia.org/wiki/Special:FilePath/Lamine%20Yamal%202025.jpg','Mbappé':'https://commons.wikimedia.org/wiki/Special:FilePath/Kylian%20Mbappe%20at%20the%202025%20UEFA%20Super%20Cup.jpg','Vini Jr.':'https://commons.wikimedia.org/wiki/Special:FilePath/Vinicius%20Junior%202025.jpg','Pedri':'https://commons.wikimedia.org/wiki/Special:FilePath/Pedri%202025.jpg','Bellingham':'https://commons.wikimedia.org/wiki/Special:FilePath/Jude%20Bellingham%202025.jpg','Raphinha':'https://commons.wikimedia.org/wiki/Special:FilePath/Raphinha%202025.jpg'};let selectedTeam='barca',players=[],ball=null,controlled=0,running=false,paused=false,matchTime=300,goals=[0,0],joy={x:0,y:0},sprint=false,last=0,flash='';const W=120,H=70;function resize(){const d=devicePixelRatio||1;canvas.width=innerWidth*d;canvas.height=innerHeight*d;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function teamName(t){return t==='barca'?'برشلونة':'ريال مدريد'}function buildRoster(){const r=document.getElementById('roster');r.innerHTML='';squads[selectedTeam].forEach(p=>{const d=document.createElement('div');d.className='card';const im=document.createElement('img');im.src=pics[p[1]]||'https://ui-avatars.com/api/?name='+encodeURIComponent(p[1])+'&background=26313c&color=fff&size=80';const x=document.createElement('div');x.innerHTML='<div class="n">#'+p[0]+'</div><div class="p">'+p[1]+'</div>';d.append(im,x);r.append(d)})}buildRoster();function setTeam(t){selectedTeam=t;barca.classList.toggle('active',t==='barca');madrid.classList.toggle('active',t==='madrid');buildRoster()}barca.onclick=()=>setTeam('barca');madrid.onclick=()=>setTeam('madrid');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active')});function makePlayer(team,i){const attack=team===selectedTeam?1:-1;const formations=[[4,0],[14,-18],[14,-6],[14,6],[14,18],[4,-13],[4,0],[4,13],[-9,-18],[-10,0],[-9,18]];const [x,z]=formations[i];return{id:i,team,x:60+x*attack,z:35+z,homeX:60+x*attack,homeZ:35+z,vx:0,vz:0,r:1.35,name:squads[team][i][1]}}function resetMatch(){players=[];for(let i=0;i<11;i++)players.push(makePlayer(selectedTeam,i));const opp=selectedTeam==='barca'?'madrid':'barca';for(let i=0;i<11;i++)players.push(makePlayer(opp,i));controlled=0;ball={x:players[0].x+selectedTeam==='barca'?2:-2,y:players[0].z,vx:0,vy:0,owner:0};ball.x=players[controlled].x+(selectedTeam==='barca'?2:-2);ball.y=players[controlled].z;goals=[0,0];matchTime=300;flash='';}function start(){resetMatch();running=true;paused=false;menu.classList.add('hidden');hud.classList.remove('hidden');controls.classList.remove('hidden');document.getElementById('homeBadge').src=crest[selectedTeam];document.getElementById('awayBadge').src=crest[selectedTeam==='barca'?'madrid':'barca'];try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}start.onclick=start;pause.onclick=()=>paused=!paused;function fieldScale(){const top=68,bottom=innerHeight-8,left=10,right=innerWidth-10;const sx=(right-left)/W,sy=(bottom-top)/H,s=Math.min(sx,sy);return{left:left+(right-left-W*s)/2,top:top+(bottom-top-H*s)/2,s}}function toScreen(x,y){const q=fieldScale();return[q.left+x*q.s,q.top+y*q.s]}function drawField(){const q=fieldScale(),x=q.left,y=q.top,w=W*q.s,h=H*q.s;ctx.fillStyle='#0a3b24';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.fillStyle='#147c43';ctx.fillRect(x,y,w,h);for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#168047':'#13763e';ctx.fillRect(x+i*w/12,y,w/12,h)}ctx.strokeStyle='#ffffffd0';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.beginPath();ctx.moveTo(x+w/2,y);ctx.lineTo(x+w/2,y+h);ctx.stroke();ctx.beginPath();ctx.arc(x+w/2,y+h/2,9*q.s,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x+w/2,y+h/2,1.1*q.s,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();for(const gx of [x-3*q.s,x+w]){ctx.fillStyle='#eeeeee22';ctx.fillRect(gx,y+h/2-10*q.s,3*q.s,20*q.s)}ctx.strokeRect(x,y+h/2-11*q.s,16*q.s,22*q.s);ctx.strokeRect(x+w-16*q.s,y+h/2-11*q.s,16*q.s,22*q.s);ctx.strokeRect(x,y+h/2-5*q.s,5*q.s,10*q.s);ctx.strokeRect(x+w-5*q.s,y+h/2-5*q.s,5*q.s,10*q.s);for(let yy of [y-1,y+h]){ctx.fillStyle='#fff';ctx.fillRect(x-1,yy,w+2,1)}}function drawGoal(x){const q=fieldScale(),[sx,sy]=toScreen(x,35),s=q.s;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(sx+(x<60?-1:0),sy-6*s, (x<60?-5:5)*s,12*s)}function drawPlayers(){const sorted=[...players].sort((a,b)=>a.z-b.z);for(const p of sorted){const [sx,sy]=toScreen(p.x,p.z),s=fieldScale().s;ctx.beginPath();ctx.fillStyle='#0006';ctx.ellipse(sx,sy+5*s,2.1*s,.9*s,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.fillStyle=p.team==='barca'?'#17469c':'#f2f2f2';ctx.arc(sx,sy,1.35*s,0,Math.PI*2);ctx.fill();ctx.strokeStyle=p.team==='barca'?'#e21b3c':'#d8c46a';ctx.lineWidth=.35*s;ctx.stroke();ctx.fillStyle=p.team==='barca'?'#e21b3c':'#777';ctx.fillRect(sx-.85*s,sy-.35*s,1.7*s,.55*s);if(p.id===controlled&&p.team===selectedTeam){ctx.beginPath();ctx.strokeStyle='#ffd21c';ctx.lineWidth=.45*s;ctx.arc(sx,sy,2.05*s,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#ffd21c';ctx.font='bold '+Math.max(9,2.7*s)+'px Arial';ctx.textAlign='center';ctx.fillText(p.name,sx,sy-2.8*s)}}}function drawBall(){const [sx,sy]=toScreen(ball.x,ball.y),s=fieldScale().s;ctx.beginPath();ctx.fillStyle='#0007';ctx.ellipse(sx,sy+1.5*s,1.2*s,.55*s,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.fillStyle='#fff';ctx.arc(sx,sy,1.0*s,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#222';ctx.lineWidth=.2*s;ctx.stroke()}function nearestOpponent(){const p=players[controlled],opp=players.filter(x=>x.team!==selectedTeam);let best=opp[0],bd=999;for(const o of opp){const d=Math.hypot(o.x-p.x,o.z-p.z);if(d<bd){bd=d;best=o}}return best}function nearestMate(){const p=players[controlled],mates=players.filter(x=>x.team===selectedTeam&&x.id!==controlled);let best=null,score=-999;for(const m of mates){const dx=m.x-p.x,dz=m.z-p.z,d=Math.hypot(dx,dz);const align=dx*(joy.x|| (selectedTeam==='barca'?1:-1))+dz*joy.y;const sc=align-d*.18;if(sc>score){score=sc;best=m}}return best}function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}function update(dt){if(!running||paused)return;matchTime=Math.max(0,matchTime-dt);const p=players[controlled],speed=(sprint?13:8.5)*dt;if(p&&p.team===selectedTeam){p.vx=joy.x*speed;p.vz=joy.y*speed;p.x=Math.max(2,Math.min(118,p.x+p.vx));p.z=Math.max(2,Math.min(68,p.z+p.vz))}for(const a of players){if(a.id===controlled&&a.team===selectedTeam)continue;const home=a.homeX,homeZ=a.homeZ;let tx=home,tz=homeZ;if(a.team!==selectedTeam){const op=players[controlled];tx=op.x+(op.x<60?-4:4);tz=op.z+(a.id%3-1)*6}else{tx=home+(ball.x-60)*.08;tz=homeZ+(ball.y-35)*.08}const dx=tx-a.x,dz=tz-a.z,d=Math.hypot(dx,dz)||1;const sp=(a.team===selectedTeam?3.8:4.2)*dt;a.x+=dx/d*sp;a.z+=dz/d*sp}if(ball.owner!==null){const owner=players[ball.owner];ball.x=owner.x+(joy.x||0)*1.7;ball.y=owner.z+(joy.y||0)*1.7}else{ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.985,dt*60);ball.vy*=Math.pow(.985,dt*60);if(ball.y<1||ball.y>69){ball.y=Math.max(1,Math.min(69,ball.y));ball.vy*=-.65}if(ball.x<0||ball.x>120){if(Math.abs(ball.y-35)<7){const scoring=ball.x>120?selectedTeam: selectedTeam==='barca'?'madrid':'barca';if(ball.x>120)goals[selectedTeam==='barca'?0:1]++;else goals[selectedTeam==='barca'?1:0]++;flash='GOAL!';setTimeout(()=>flash='',1300);resetKickoff();return}ball.x=Math.max(0,Math.min(120,ball.x));ball.vx*=-.65}}if(ball.owner===null){let best=null,bd=3.0;for(const a of players){const d=dist(a,ball);if(d<bd){bd=d;best=a}}if(best){ball.owner=best.id}}else{const owner=players[ball.owner];if(dist(owner,ball)>3)ball.owner=null}if(ball.owner!==null&&players[ball.owner].team!==selectedTeam&&dist(players[ball.owner],p)<3.2){ball.owner=controlled;flash=''}if(matchTime<=0){running=false;menu.classList.remove('hidden');hud.classList.add('hidden');controls.classList.add('hidden')}}function resetKickoff(){for(let i=0;i<players.length;i++){players[i].x=players[i].homeX;players[i].z=players[i].homeZ}controlled=0;ball.owner=0;ball.vx=ball.vy=0;ball.x=players[0].x;ball.y=players[0].z}function kick(type){const p=players[controlled];if(!p)return;let dx=joy.x,dz=joy.y;if(Math.hypot(dx,dz)<.2){dx=selectedTeam==='barca'?1:-1;dz=0}ball.owner=null;const power=type==='shoot'?35:type==='through'?24:17;ball.x=p.x+dx*1.5;ball.y=p.z+dz*1.5;ball.vx=dx*power;ball.vy=dz*power}function doSwitch(){const mates=players.filter(x=>x.team===selectedTeam);let idx=mates.findIndex(x=>x.id===controlled);controlled=mates[(idx+1)%mates.length].id}function draw(){drawField();drawGoal(0);drawGoal(120);drawPlayers();drawBall();if(flash){ctx.fillStyle='#fff';ctx.font='900 42px Arial';ctx.textAlign='center';ctx.fillText(flash,innerWidth/2,innerHeight*.22)}}function loop(t){const dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);draw();document.getElementById('score').textContent=teamName(selectedTeam)+' '+goals[selectedTeam==='barca'?0:1]+' — '+goals[selectedTeam==='barca'?1:0]+' '+teamName(selectedTeam==='barca'?'madrid':'barca');document.getElementById('clock').textContent=String(Math.floor(matchTime/60)).padStart(2,'0')+':'+String(Math.floor(matchTime%60)).padStart(2,'0');requestAnimationFrame(loop)}requestAnimationFrame(loop);function bindButton(id,fn){const e=document.getElementById(id);e.addEventListener('pointerdown',ev=>{ev.preventDefault();fn()})}bindButton('switch',doSwitch);bindButton('pass',()=>kick('pass'));bindButton('through',()=>kick('through'));bindButton('shoot',()=>kick('shoot'));bindButton('tackle',()=>{const p=players[controlled],o=nearestOpponent();if(o&&dist(p,o)<4){o.x+=selectedTeam==='barca'?2:-2;ball.owner=controlled}});const joyEl=document.getElementById('joy'),knob=document.getElementById('knob');function setJoy(e){const r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/(r.width/2),y=(e.clientY-cy)/(r.height/2),m=Math.hypot(x,y);if(m>1){x/=m;y/=m}joy={x,y};knob.style.transform='translate('+x*34+'px,'+y*34+'px)'}joyEl.onpointerdown=e=>{joyEl.setPointerCapture(e.pointerId);setJoy(e)};joyEl.onpointermove=e=>{if(e.buttons)setJoy(e)};joyEl.onpointerup=()=>{joy={x:0,y:0};knob.style.transform='translate(0,0)'};const run=document.getElementById('run');run.onpointerdown=()=>sprint=true;run.onpointerup=()=>sprint=false;run.onpointercancel=()=>sprint=false;document.addEventListener('visibilitychange',()=>{if(document.hidden)paused=true});</script></body></html>
